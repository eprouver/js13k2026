const generatePathData = (x1, y1, x2, y2, crazy) => {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 80;
  const j = len * (crazy ?? OPTS.fly.crazy);
  const nx = -dy / len;
  const ny = dx / len;
  const side = Math.random() < 0.5 ? 1 : -1;
  const c1x = x1 + dx * 0.3 + nx * j * side * (0.4 + Math.random() * 0.6);
  const c1y = y1 + dy * 0.3 + ny * j * side * (0.4 + Math.random() * 0.6);
  const c2x = x1 + dx * 0.7 + nx * j * -side * (0.3 + Math.random() * 0.5);
  const c2y = y1 + dy * 0.7 + ny * j * -side * (0.3 + Math.random() * 0.5);
  return `M ${x1} ${y1} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`;
};

const offscreenUpperThird = () => {

const flyStartPoint = (fromEl, opts, node) => {
  if (opts.fromOffscreen) return offscreenUpperThird();
  const origin = fromEl || node;
  if (!origin?.getBoundingClientRect) return offscreenUpperThird();
  const a = origin.getBoundingClientRect();
  const x = a.left + a.width / 2;
  const y = a.top + a.height / 2;
  const tiny = a.width < 4 || a.height < 4;
  const offView =
    !node &&
    (y < -20 || y > innerHeight + 20 || x < -20 || x > innerWidth + 20);
  if (tiny || offView) return offscreenUpperThird();
  return { x, y };
};

const flyOnPath = (fromEl, toEl, opts = {}) =>
  new Promise((resolve) => {
    const node = opts.node;
    if (!toEl || (node != null && !node)) {
      if (!node) fromEl?.remove?.();
      resolve();
      return;
    }

    const b = toEl.getBoundingClientRect();
    const { x: x1, y: y1 } = flyStartPoint(fromEl, opts, node);
    const x2 = b.left + b.width / 2;
    const y2 = b.top + b.height / 2;
    const ms = opts.ms ?? (node ? OPTS.fly.trophyMs : OPTS.fly.ms);
    const crazy = opts.crazy ?? (node ? OPTS.fly.trophyCrazy : OPTS.fly.crazy);
    const delay = opts.delay ?? 0;

    const mover = div({
      className: node ? "fly flyn" : "fly",
    });
    if (node) {
      const nr = node.getBoundingClientRect();
      const size = Math.max(nr.width, nr.height, 8);
      mover.style.width = `${size}px`;
      mover.style.height = `${size}px`;
    }
    mover.style.offsetPath = `path("${generatePathData(x1, y1, x2, y2, crazy)}")`;
    mover.style.offsetPosition = "0 0";
    mover.style.offsetDistance = "0%";
    mover.style.animationDuration = `${ms}ms`;
    mover.style.animationDelay = `${delay}ms`;

    if (node) {
      if (node.style) {
        node.style.position = "";
        node.style.left = "";
        node.style.top = "";
        node.style.zIndex = "";
      }
      mover.append(node);
    } else {
      const size = opts.fromOffscreen ? 34 : 28;
      mover.style.setProperty("--fly", opts.fill || "gold");
      mover.style.width = `${size}px`;
      mover.style.height = `${size}px`;
      if (fromEl) {
        fromEl.style.visibility = "hidden";
        clearHintMask(fromEl);
      }
    }

    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      mover.remove();
      if (!node) {
        clearHintMask(fromEl);
        fromEl?.remove?.();
      }
      (opts.sfx || sfxLand)();
      resolve();
    };
    mover.addEventListener("animationend", finish, { once: true });
    setTimeout(finish, delay + ms + 120);
    if (!node) sfxLand();
    document.body.append(mover);
  });

const mulberry32 = (a) => () => {
  a |= 0;
  a = (a + 0x6d2b79f5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

};

const buildMesh = (rand, n = 3) => {
  const xs = [0];
  const ys = [0];
  const xw = [];
  const yw = [];
  let wx = 0;
  let wy = 0;
  for (let i = 0; i < n; i++) {
    const a = 0.5 + rand();
    const b = 0.5 + rand();
    xw.push(a);
    yw.push(b);
    wx += a;
    wy += b;
  }
  for (let i = 0; i < n; i++) {
    xs.push(xs[i] + xw[i] / wx);
    ys.push(ys[i] + yw[i] / wy);
  }
  xs[n] = ys[n] = 1;
  const pts = [];
  for (let j = 0; j <= n; j++)
    for (let i = 0; i <= n; i++) {
      let x = xs[i];
      let y = ys[j];
      if (i && i < n) x += (rand() - 0.5) * (xs[i] - xs[i - 1]) * 0.45;
      if (j && j < n) y += (rand() - 0.5) * (ys[j] - ys[j - 1]) * 0.45;
      pts.push([Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))]);
    }
  const at = (i, j) => pts[j * (n + 1) + i];
  const tris = [];
  for (let j = 0; j < n; j++)
    for (let i = 0; i < n; i++) {
      const a = at(i, j);
      const b = at(i + 1, j);
      const c = at(i + 1, j + 1);
      const d = at(i, j + 1);
      if (rand() < 0.5) tris.push([a, b, c], [a, c, d]);
      else tris.push([a, b, d], [b, c, d]);
    }
  return tris;
};

const createMeshData = (seed) => {
  const rand = mulberry32(seed >>> 0);

  const svg = svgEl("svg", {

        fill: `color-mix(in srgb,var(--wall-lo) ${(rand() * 100) | 0}%,var(--wall-hi))`,
      })
    );
  }
  return { svg, tris };
};

const triCentroid = ([[x1, y1], [x2, y2], [x3, y3]]) => [
  (x1 + x2 + x3) / 3,
  (y1 + y2 + y3) / 3,
];

const pickCollectTris = (tris, seed, count) => {
  if (count < 1 || !tris.length) return [];
  const pick = mulberry32((seed ^ 0xc0ffee) >>> 0);
  let pool = tris.filter((t) => {
    const [cx, cy] = triCentroid(t);
    return cx > 0.18 && cx < 0.82 && cy > 0.18 && cy < 0.82;
  });
  if (!pool.length) pool = tris.slice();
  const chosen = [];
  const rest = pool.slice();
  while (chosen.length < count && rest.length)
    chosen.push(rest.splice((pick() * rest.length) | 0, 1)[0]);
  while (chosen.length < count) chosen.push(chosen[chosen.length - 1] || tris[0]);
  return chosen;
};

function ensureRevealDefs() {

  wrap.id = "reveal-defs";

function stopRevealRaf() {

function resetLayerMask(layer) {
  if (!layer) return;
  off(layer, "revealing", "hiding", "revealed");
  setCircleR(layer.querySelector(".rc"), 0);
}

function resetRevealMask() {
  stopRevealRaf();
  revealLayers.forEach(resetLayerMask);
  revealLayers = [];
}

const asLayers = (x) => (Array.isArray(x) ? x : [x]).filter(Boolean);

function playRevealMask(layerOrLayers) {
  ensureRevealDefs();
  stopRevealRaf();
  const layers = asLayers(layerOrLayers);
  for (const prev of revealLayers) if (!layers.includes(prev)) resetLayerMask(prev);
  if (!layers.length) {
    revealLayers = [];
    return;
  }
  revealLayers = layers;
  const circles = layers.map((layer) => {
    off(layer, "revealed", "hiding");
    on(layer, "revealing");
    const c = layer.querySelector(".rc");
    setCircleR(c, 0);
    return c;
  });
  if (circles.some((c) => !c)) return;
  runTween(REVEAL_MS, {
    setRaf: (id) => {
      revealRaf = id;
    },
    onTick: (eased) => circles.forEach((c) => setCircleR(c, R_MAX * eased)),
    onDone: () =>
      layers.forEach((layer, i) => {
        setCircleR(circles[i], R_MAX);
        off(layer, "revealing");
        on(layer, "revealed");
      }),
  });
}

function playHideMask(layerOrLayers, onDone) {
  ensureRevealDefs();
  stopRevealRaf();
  const layers = asLayers(layerOrLayers);
  if (!layers.length) return void onDone?.();
  revealLayers = layers;
  const circles = layers.map((layer) => {
    off(layer, "revealed", "revealing");
    on(layer, "hiding");
    return layer.querySelector(".rc");
  });
  if (circles.some((c) => !c)) return void onDone?.();
  const r0s = circles.map((c) => readCircleR(c, R_MAX));
  const dur = Math.max(400, REVEAL_MS * (Math.max(...r0s, 1) / R_MAX));
  runTween(dur, {
    setRaf: (id) => {
      revealRaf = id;
    },
    onTick: (eased) =>
      circles.forEach((c, i) => setCircleR(c, r0s[i] * (1 - eased))),
    onDone: () => {
      layers.forEach(resetLayerMask);
      revealLayers = [];
      onDone?.();
    },
  });
}

const indexToRC = (index, cols) => ({
  row: (index / cols) | 0,
  col: index % cols,
});

const generateMaze = (cols = 5, rows = cols) => {
  const n = cols * rows;
  const doors = Array.from({ length: n }, () => ({}));
  const seen = new Uint8Array(n);
  const stack = [0];
  seen[0] = 1;
  const dirs = [
    [-1, 0, "N", "S"],
    [1, 0, "S", "N"],
    [0, -1, "W", "E"],
    [0, 1, "E", "W"],
  ];
  while (stack.length) {
    const cur = stack[stack.length - 1];
    const { row, col } = indexToRC(cur, cols);
    const opts = [];
    for (const [dr, dc, d, opp] of dirs) {
      const r = row + dr;
      const c = col + dc;
      if (r < 0 || c < 0 || r >= rows || c >= cols) continue;
      const id = r * cols + c;
      if (!seen[id]) opts.push([id, d, opp]);
    }
    if (!opts.length) {
      stack.pop();
      continue;
    }
    const [id, d, opp] = opts[(Math.random() * opts.length) | 0];
    doors[cur][d] = id;
    doors[id][opp] = cur;
    seen[id] = 1;
    stack.push(id);
  }
  return { cols, rows, doors };
};

};

const mazeRooms = (cols, rows = cols) => {
  const { doors } = generateMaze(cols, rows);
  return doors.map((d, id) => {
    const { row, col } = indexToRC(id, cols);
    return {
      id,
      x: col,
      z: row,
      doors: { ...d },
    };
  });
};

const pickLevelColors = (count, exclude = []) => {
  const ban = new Set(exclude);
  return shuffle(RAINBOW.filter((c) => !ban.has(c.i))).slice(0, count);
};

const placeTriangles = (rooms, colors, perColor = PER_COLOR) => {
  const slots = [];
  for (const r of rooms) {
    for (const face of ["N", "E", "S", "W", "U", "D"]) {
      if (face in r.doors) continue;
      slots.push({ room: r.id, face });
    }
  }
  shuffle(slots);
  const tris = [];
  let i = 0;
  for (const color of colors) {
    for (let n = 0; n < perColor; n++) {
      const s = slots[i % slots.length];
      i++;
      tris.push({
        id: `t${tris.length}`,
        room: s.room,
        face: s.face,
        color,
      });
    }
  }
  return tris;
};

const buildLevel = (index, exclude = []) => {
  const maxC = OPTS.level.maxMazeSize;
  const maxR = OPTS.level.maxMazeRows;
  const raw =
    OPTS.level.defs[index] || {
      mazeSize: maxC,
      mazeRows: maxR,
      colorCount: 1 + index,
    };
  const cols = raw.mazeSize <= 0 ? 0 : Math.min(maxC, raw.mazeSize);
  const rows = cols ? Math.min(maxR, raw.mazeRows || raw.mazeSize) : 0;
  const rooms = cols ? mazeRooms(cols, rows) : tutorialRooms();
  const colors = pickLevelColors(Math.min(6, raw.colorCount || 1), exclude);
  return {
    index,
    mazeSize: cols,
    rooms,
    colors,
    triangles: colors.length
      ? placeTriangles(rooms, colors, PER_COLOR)
      : [],
    perColor: PER_COLOR,
  };
};

const CUBE_FACES = 6;

const CUBE_TURNS = [
  [0, 0],
  [90, 0],
  [180, 0],
  [270, 0],
  [0, 90],
  [0, -90],
];

const cubeFill = (c) =>
  colorHsl({ ...c, l: Math.max(c.l, OPTS.cube.minLightness) });

const makeGem = (color, slot) => {
  const fill = cubeFill(color);
  const cubeFace = slot?.querySelector?.(".cf");
  const endSize = Math.max(
    16,
    cubeFace?.getBoundingClientRect?.().width ||
      (slot?.getBoundingClientRect?.().width || 52) * 0.34
  );
  const gem = div({ className: "gem" });
  gem.style.setProperty("--fly", fill);
  gem.style.background = fill;
  box(gem, { w: endSize, h: endSize });
  return { gem, fill, endSize };
};

function createCube({ color, unlockedFaces = [], pendingFaces = [] }) {
  const lit = new Set(unlockedFaces);
  const pending = new Set(pendingFaces);
  const fill = cubeFill(color);

  const faces = CUBE_TURNS.map(([ry, rx], i) => {
    const isPending = pending.has(i);
    const on = lit.has(i) && !isPending;
    const face = div({
      className: on ? "cf lit" : isPending ? "cf pending" : "cf",
      style: {
        background: on ? fill : "#3a3a42",
        transform: `rotateY(${ry}deg) rotateX(${rx}deg) translateZ(1em)`,
      },
    });
    face.dataset.i = String(i);
    return face;
  });

  return div({ className: "cube", style: { "--cube": fill } }, ...faces);
}

function createCubeRack() {
  const litByColor = RAINBOW.map(() => new Set());

  const slots = RAINBOW.map((c, i) => {
    const slot = div({
      className: "ds",
      style: { ...toneStyle("slot", c), "--slot": cubeFill(c), "--d": i * 0.2 + "s" },
    });
    return slot;
  });

  const rack = div({ id: "drk" }, ...slots);
  document.body.append(rack);

  const slotFor = (color) => slots[color.i];

  function paint(rainbow, pendingFaces = []) {
    const slot = slots[rainbow.i];
    if (!slot) return null;
    const lit = litByColor[rainbow.i];
    if (!lit.size && !pendingFaces.length) {
      slot.replaceChildren();
      return slot;
    }
    const pending = new Set(pendingFaces);
    slot.replaceChildren(
      createCube({
        color: rainbow,
        unlockedFaces: [...new Set([...lit, ...pending])],
        pendingFaces: [...pending],
      })
    );
    return slot;
  }

  const nextFace = (i) => {
    const lit = litByColor[i];
    for (let f = 0; f < CUBE_FACES; f++) if (!lit.has(f)) return f;
    return -1;
  };

  function igniteFace(slot, faceIndex) {
    const face = slot?.querySelector?.(`.cf[data-i="${faceIndex}"]`);
    if (!face) return;
    off(face, "pending");
    void face.offsetWidth;
    on(face, "lit", "ignite");
    const fill = slot.querySelector(".cube")?.style.getPropertyValue("--cube");
    if (fill) face.style.background = fill;
  }

  const retireFull = (rainbow, slot, gemEl) => {
    paint(rainbow);
    gemEl?.remove();
    retireColorFromLevel(rainbow.i);
    return slot;
  };

  async function deliver(color, gemEl) {
    const slot = slotFor(color);
    if (!slot) return null;
    const face = nextFace(color.i);
    if (face < 0) return retireFull(color, slot, gemEl);
    await flyThen(gemEl, slot, { node: gemEl, ms: OPTS.fly.trophyMs, sfx: sfxReward });
    if (bodyHas("won")) return null;
    return settleFace(color, face);
  }

  async function settleFace(rainbow, faceIndex) {
    litByColor[rainbow.i].add(faceIndex);
    const slot = paint(rainbow, [faceIndex]);
    await nextFrame();
    igniteFace(slot, faceIndex);
    if (isFull(rainbow.i)) retireColorFromLevel(rainbow.i);
    if (allComplete()) endGameWon();
    else powers.syncAll();
    return slot;
  }

  const litCount = () => {
    let n = 0;
    for (const s of litByColor) n += s.size;
    return n;
  };

  function rallyRoom(spare = 1) {
    let open = 0;
    for (const s of litByColor) {
      if (s.size > 0 && s.size < CUBE_FACES) open += CUBE_FACES - s.size;
    }
    return Math.max(0, Math.min(open, RAINBOW.length * CUBE_FACES - spare - litCount()));
  }

  async function addFaces(n, spare = 0) {
    const picks = [];
    const incoming = RAINBOW.map(() => []);
    for (let i = 0; i < Math.max(0, n); i++) {
      if (rallyRoom(spare) <= 0) break;
      const targets = RAINBOW.filter(
        (c) => litByColor[c.i].size > 0 && !isFull(c.i)
      );
      if (!targets.length) break;
      const c = shuffle(targets.slice())[0];
      const f = nextFace(c.i);
      if (f < 0) continue;
      litByColor[c.i].add(f);
      incoming[c.i].push(f);
      paint(c, incoming[c.i]);
      picks.push([c, f]);
    }
    await Promise.all(
      picks.map(([c, f]) => {
        const slot = slotFor(c);
        const { gem } = makeGem(c, slot);
        return flyIn(null, slot, { node: gem, sfx: sfxReward }, () => {
          if (bodyHas("won")) return;
          igniteFace(slot, f);
          if (isFull(c.i)) retireColorFromLevel(c.i);
        });
      })
    );
    if (allComplete()) endGameWon();
    else powers.syncAll();
    return picks.length;
  }

  const isFull = (i) => litByColor[i].size >= CUBE_FACES;
  const isColorComplete = (color) => isFull(color.i);
  const completed = () => RAINBOW.filter((c) => isFull(c.i)).map((c) => c.i);
  const allComplete = () => RAINBOW.every((c) => isFull(c.i));

  return {
    slots,
    deliver,
    addFaces,
    rallyRoom,
    isColorComplete,
    completed,
    allComplete,
  };
}

function createPuzzleUI(opts) {

  const fill = colorHsl(color);
  const ids = [];
  let solved = false;
  let completing = false;

  const pips = Array.from({ length: total }, () => {
    const wrap = div({ className: "tpw" });
    wrap.append(tinyPipSvg());
    return wrap;
  });
  const tab = button({ className: "ct", style: toneStyle("tab", color) });
  tab.append(div({ className: "tps" }, ...pips));
  const hold = div({ className: "cth" }, tab);
  tabsBar.append(hold);

  const syncPow = () => powers.syncAll();
  const clrTab = () => {
    tab.style.position =
      tab.style.left =
      tab.style.top =
      tab.style.width =
      tab.style.height =
      tab.style.margin =
      tab.style.zIndex =
        "";
    hold.style.cssText = "";
  };

  function refreshPips() {
    const n = ids.length;
    pips.forEach((pip, i) => {
      pip.hidden = i >= total;

          "fill",
          i < n ? fill : "#333"

    });

  function tryComplete() {
    if (solved || completing || ids.length < total) return;
    completing = true;
    solved = true;
    ids.forEach(clearHintMask);
    pruneWashes();
    on(tab, "ready");
    syncPow();
    onComplete();

  function addPieceToTray(id) {
    if (solved || completing || ids.includes(id)) return null;
    ids.push(id);
    clearHintMask(id);
    refreshPips();
    syncPow();
    if (ids.length >= total) tryComplete();
    return tab;
  }

  function flyIn(id, layer) {
    const run = () => addPieceToTray(id);
    if (!layer || !document.body.contains(layer)) return void run();
    flyThen(layer, tab, { fill }, run);
  }

  function reset() {
    solved = false;
    completing = false;
    ids.length = 0;
    off(tab, "ready", "sealing", "sealed");
    clrTab();
    if (tab.parentNode !== hold) hold.append(tab);
    tab.hidden = false;
    refreshPips();
    syncPow();
  }

  function removeTab() {
    hold.remove();
    const root = tabsBar.closest("#proot");
    if (tabsBar && !tabsBar.childElementCount) root?.remove();
  }

  async function collapseToGem() {
    const slot = cubeRack.slots[color.i];
    const { gem, endSize } = makeGem(color, slot);
    const r0 = tab.getBoundingClientRect();
    hold.style.width = hold.style.minWidth = `${r0.width}px`;
    hold.style.height = `${r0.height}px`;
    tab.style.transition = "none";
    document.body.append(tab);
    tab.style.position = "fixed";
    tab.style.zIndex = "121";
    tab.style.left = `${r0.left}px`;
    tab.style.top = `${r0.top}px`;
    tab.style.width = `${r0.width}px`;
    tab.style.height = `${r0.height}px`;
    tab.style.margin = "0";
    const r1 = tab.getBoundingClientRect();
    tab.style.transition = "";
    on(tab, "sealing");
    tab.style.width = tab.style.height = `${endSize}px`;
    tab.style.left = `${r1.left + r1.width / 2 - endSize / 2}px`;
    tab.style.top = `${r1.top + r1.height / 2 - endSize / 2}px`;
    await wait(OPTS.time.sealMs);
    const r = tab.getBoundingClientRect();
    gem.style.position = "fixed";
    gem.style.zIndex = "121";
    gem.style.width = gem.style.height = `${endSize}px`;
    gem.style.left = `${r.left + r.width / 2 - endSize / 2}px`;
    gem.style.top = `${r.top + r.height / 2 - endSize / 2}px`;
    document.body.append(gem);
    clrTab();
    off(tab, "sealing", "ready");
    on(tab, "sealed");
    hold.append(tab);
    await nextFrame();
    return gem;
  }

  refreshPips();
  return {
    flyIn,
    addPieceToTray,
    reset,
    remove: removeTab,
    collapseToGem,
    tab,
  };
}

function createPuzzleSet(colors, perColor, onColorComplete) {
  const root = div({ id: "proot" });

      color: c,

    map,

    destroy() {
      Object.values(map).forEach((p) => p.remove());
      root.remove();

  };
}

const POWERS = [
  ["wash", "W", uniCyan],
  ["evoke", "E", uniPink],
  ["rally", "R", uniGold],
];
const POWER_IDS = POWERS.map((p) => p[0]);
const POWER_KEY = { w: "wash", e: "evoke", r: "rally" };
const powStyle = (fill) => ({
  "--pow": `color-mix(in srgb, ${fill} 65%, #000)`,
  "--pow-dark": `color-mix(in srgb, ${fill} 27%, #201018)`,
});

const powerState = Object.fromEntries(
  POWER_IDS.map((id) => [id, { level: 0, active: false, cooling: false }])
);

const lv1 = (n) => Math.max(1, n | 0);
const powerCd = (id, level) => {
  const [base, step, min] = OPTS.powers[id + "Cd"] || OPTS.powers.cd;
  return Math.max(min, base - (lv1(level) - 1) * step);
};

const powerBtn = ([id, glyph, fill], n, extra) => {
  const btn = button({
    className: extra ? `ps ${extra}` : "ps",
    style: powStyle(fill),
  });
  btn.dataset.power = id;
  btn.append(div({ className: "pg" }, glyph), div({ className: "pl" }, String(n)));
  return btn;
};

let upgradeQueue = Promise.resolve();
let upgradeWait = 0;

function createPowerSystem() {
  const slots = POWERS.map((p) => {
    const slot = powerBtn(p, 0, "locked");
    slot.disabled = true;
    slot.onclick = () => activatePower(p[0]);
    return slot;
  });
  document.body.append(div({ id: "prk" }, ...slots));

  const gate = (id) =>
    id === "rally" ? levelIndex >= OPTS.powers.rallyFromLevel : true;
  const unlocked = (id) => powerState[id].level > 0 && gate(id);

  const openPool = () => {
    const ids = new Set(levelColors.map((c) => c.i));
    return triangles.filter((t) => {
      const el = layerById(t.id);
      return (
        !collected.has(t.id) &&
        ids.has(t.color.i) &&
        el &&
        el.style.visibility !== "hidden"
      );
    });
  };

  function syncSlot(id) {
    const st = powerState[id];
    const slot = slots[POWER_IDS.indexOf(id)];
    slot.querySelector(".pl").textContent = String(st.level);
    const lock = !unlocked(id);
    const empty =
      !lock &&
      ((id === "evoke" && !openPool().length) ||
        (id === "rally" && !(cubeRack.rallyRoom() > 0)));
    const held = bodyHas("rewarding");
    tog(slot, "locked", lock || empty);
    tog(slot, "active", st.active);
    tog(slot, "cooling", st.cooling);
    slot.disabled = lock || empty || st.active || st.cooling || held;
  }
  const syncAll = () => POWER_IDS.forEach(syncSlot);

  function beginBusy(id, activeMs) {
    const st = powerState[id];
    st.active = st.cooling = true;
    syncSlot(id);
    const cd = powerCd(id, st.level);
    setTimeout(() => {
      st.active = false;
      syncSlot(id);
    }, Math.min(activeMs, cd));
    setTimeout(() => {
      st.cooling = false;
      syncSlot(id);
    }, cd);
  }

  function showUpgrade() {
    return new Promise((resolve) => {
      if (bodyHas("won")) {
        upgradeWait--;
        resolve();
        return;
      }
      const canPick = (id) => gate(id);
      let picked = false;
      let onKey;

      const choices = POWERS.map((p) => {
        const [id] = p;
        const ok = canPick(id);
        const btn = powerBtn(
          p,
          "+",
          ok ? "ppk" : "ppk locked"
        );
        btn.disabled = !ok;
        if (ok) btn.onclick = () => commit(id);
        return btn;
      });
      const modal = showModal(div({ className: "ppks" }, ...choices), 4 / 3);
      syncAll();

      const finish = (id) => {
        upgradeWait--;
        if (bodyHas("won")) {
          resolve(id);
          return;
        }
        if (upgradeWait > 0) {
          resolve(id);
          return;
        }
        modal?.remove();
        bodyOff("rewarding");
        syncAll();
        resolve(id);
      };
      const close = (id) => {
        if (picked || bodyHas("won")) return;
        picked = true;
        removeEventListener("keydown", onKey);
        const more = upgradeWait > 1;
        if (!more) on(modal, "out");
        setTimeout(() => finish(id), more ? 400 : 520);
      };
      const commit = (id) => {
        if (picked || bodyHas("won") || !canPick(id)) return;
        sfxPick();
        on(choices[POWER_IDS.indexOf(id)], "picked");
        close(id);
        const st = powerState[id];
        st.level++;
        syncSlot(id);
      };

      onKey = (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const id = POWER_KEY[e.key.toLowerCase()];
        if (!id) return;
        e.preventDefault();
        commit(id);
      };
      addEventListener("keydown", onKey);
    });
  }

  const offerUpgrade = () => {
    if (bodyHas("won")) return Promise.resolve();
    upgradeWait++;
    const p = upgradeQueue.then(showUpgrade, showUpgrade);
    upgradeQueue = p.catch(() => {});
    return p;
  };

  function noteCollected(id) {
    clearHintMask(id);
    syncAll();
  }

  function runWash(level) {
    const facing = facingFaceKey();
    const opp = { N: "S", S: "N", E: "W", W: "E" }[facing];
    const all = openPool();
    const pool = opp
      ? all.filter((t) => !(t.room === player.room && t.face === opp))
      : all;
    const picks = shuffle((pool.length ? pool : all).slice()).slice(0, lv1(level));

    picks.forEach((t) => {
      if (collected.has(t.id)) return;
      const layer = layerById(t.id);
      if (!layer || layer.style.visibility === "hidden") return;
      playWash(layer, colorHsl(colorPair(t.color)));
    });
  }

  function runEvoke(level) {
    const pool = openPool();
    if (!pool.length) return;
    const i = shuffle([...new Set(pool.map((t) => t.color.i))])[0];
    const picks = shuffle(pool.filter((t) => t.color.i === i)).slice(
      0,
      lv1(level)
    );
    const puzzle = puzzles.map[i];
    if (!puzzle) return;

    picks.forEach((t) => {
      const claim = claimTriangle(t.id);
      if (!claim) return;
      const { layer } = claim;
      if (!layer) return void puzzle.addPieceToTray(t.id);
      flyIn(layer, puzzle.tab, { fill: colorHsl(t.color) }, () =>
        puzzle.addPieceToTray(t.id)
      );
    });
    pruneWashes();
  }

  function runRally(n) {
    if (!(cubeRack.rallyRoom() > 0)) return;
    Promise.resolve(cubeRack.addFaces(n, 1)).then(() => {
      syncAll();
      if (levelCleared()) transitionToLevel(levelIndex + 1);
    });
  }

  function activatePower(id) {
    const st = powerState[id];
    if (!unlocked(id) || st.active || st.cooling || bodyHas("rewarding") || bodyHas("won")) return;
    if (id === "evoke" && !openPool().length) return;
    if (id === "rally" && !(cubeRack.rallyRoom() > 0)) return;

    uniGo();
    sfxReward(4 / 3);

    if (id === "rally") {
      runRally(lv1(st.level));
      beginBusy(id, OPTS.fly.trophyMs + 400);
    } else {
      if (id === "wash") runWash(st.level);
      else runEvoke(st.level);
      beginBusy(id, 900);
    }
  }

  syncAll();
  return {
    offerUpgrade,
    activatePower,
    syncAll,
    noteCollected,
  };
}

  a[1] * b[2] - a[2] * b[1],
  a[2] * b[0] - a[0] * b[2],

    v[0] * c + cx * s + axis[0] * d * k,
    v[1] * c + cy * s + axis[1] * d * k,
    v[2] * c + cz * s + axis[2] * d * k,

        rotAround(ff, axis, ang)
      );
    },
    onDone: () => {
      turnBusy = 0;
      look();
      pumpQ();
    },
  });
};

function facingFaceKey() {
  const [fx, fy, fz] = player.forward;
  const ax = Math.abs(fx);
  const ay = Math.abs(fy);
  const az = Math.abs(fz);
  if (ay >= ax && ay >= az) return fy > 0 ? "U" : "D";
  if (ax >= az) return fx > 0 ? "E" : "W";
  return fz < 0 ? "N" : "S";
}

function buildRoom(spec) {
  const walls = FACES.filter(([key]) => !(key in spec.doors)).map(([key, cls]) => {
    const face = div({ className: "face" });
    face.dataset.face = key;
    const hides = hiddensOn(spec.id, key);
    paintWall(
      face,
      hides.map((h) => ({ id: h.id, color: h.color }))
    );
    return div({ className: `wall ${cls}` }, face);
  });

  return div(
    {
      id: `room-${spec.id}`,
      className: "room",
      style: {
        transform: `translate3d(calc(${spec.x} * var(--span)), 0px, calc(${spec.z} * var(--span)))`,
      },
    },
    ...walls
  );
}

const world = div({ id: "world" });
const pivot = div({ id: "pivot" }, world);
const camera = div({ id: "camera" }, pivot);
const viewport = div({ id: "viewport" }, camera);
const inspectStage = div({ id: "istage", hidden: true });

document.body.append(viewport, inspectStage);

let chromeless;
const tryChromeless = () => {
  if (chromeless++ || !matchMedia("(hover:none)").matches) return;
  document.documentElement.requestFullscreen?.().catch?.(() => {});
};

let sx, sy, swiped;
viewport.addEventListener("click", () => {
  tryChromeless();
  if (swiped) return void (swiped = 0);
  if (turnBusy || bodyHas("rewarding") || bodyHas("won")) return;
  primaryAction();
});
viewport.addEventListener("touchstart", (e) => {
  const t = e.changedTouches[0];
  sx = t.clientX;
  sy = t.clientY;
  swiped = 0;
}, { passive: true });
viewport.addEventListener("touchend", (e) => {
  if (bodyHas("rewarding") || bodyHas("won")) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - sx;
  const dy = t.clientY - sy;
  if (dx * dx + dy * dy < 576) return;
  swiped = 1;
  doTurn(Math.abs(dx) > Math.abs(dy) ? +(dx > 0) : 2 + (dy > 0));
});

const cubeRack = createCubeRack();
const powers = createPowerSystem();

function levelCleared() {
  return (
    triangles.every((t) => collected.has(t.id)) &&
    levelColors.every((c) => solvedColors.has(c.i))
  );
}

function retireColorFromLevel(i) {
  if (i == null) return;
  solvedColors.add(i);
  let stripped = false;
  for (const t of triangles) {
    if (t.color.i !== i) continue;
    clearHintMask(t.id);
    if (collected.has(t.id)) continue;
    collected.add(t.id);
    layerById(t.id)?.remove();
    stripped = true;
  }
  puzzles?.map?.[i]?.remove();
  if (puzzles?.map) delete puzzles.map[i];
  levelColors = levelColors.filter((c) => c.i !== i);
  if (stripped && player.inspecting) {
    const layers = faceLayers(inspectFace());
    if (layers.length) trackInspectHits(layers);
    else stopHitTracking();
  }
  powers.syncAll();
}

let rewardInflight = 0;

async function onColorComplete(color, puzzle) {
  if (bodyHas("won")) return;
  rewardInflight++;
  solvedColors.add(color.i);
  sfxReward(3 / 4, 0.2);
  try {
    const left = triangles.filter(
      (t) => t.color.i === color.i && !collected.has(t.id)
    ).length;

    await wait(OPTS.time.solveHoldMs);
    if (bodyHas("won")) return;

    const gem = await puzzle.collapseToGem();
    if (bodyHas("won")) return;
    await cubeRack.deliver(color, gem);
    if (bodyHas("won") || cubeRack.allComplete()) {
      endGameWon();
      return;
    }

    if (cubeRack.isColorComplete(color)) {
      retireColorFromLevel(color.i);
    } else if (left >= PER_COLOR) {
      puzzle.reset();
    } else {
      puzzle.remove();
    }

    await wait(300);
    if (bodyHas("won")) return;
    await powers.offerUpgrade();
    if (bodyHas("won") || rewardInflight > 1) return;

    if (cubeRack.allComplete()) {
      endGameWon();
      return;
    }
    if (levelCleared()) await transitionToLevel(levelIndex + 1);
  } finally {
    rewardInflight--;
    if (!bodyHas("won") && !qs(".pmod")) bodyOff("rewarding");
    powers.syncAll();
  }
}

function endGameWon() {
  if (bodyHas("won")) return;
  bodyOn("won");
  qs(".pmod")?.remove();
  bodyOff("rewarding");
  document.body.append(div({ id: "win" }, "You Won!"));
  musicWin();
  cubeRack.slots.forEach((_, i) =>
    setTimeout(() => sfxReward(4 / 3), i * 200)
  );
  powers.syncAll();
}

function showHelp() {
  bodyOn("hi");
  const modal = showModal([
    v.h2(
      { className: "ph" },
      "Find the Triangles: Save the Rainbow"
    ),
    div(
      { className: "ph" },
      "Swipe or arrows to turn\nTap or space to move\nPowerups will help"
    ),
  ]);
  const go = () => {
    tryChromeless();
    removeEventListener("keydown", go);
    modal.onclick = null;
    on(modal, "out");
    setTimeout(() => {
      modal.remove();
      bodyOff("rewarding", "hi");
      powers.syncAll();
    }, 520);
  };
  addEventListener("keydown", go);
  modal.onclick = go;
}

async function transitionToLevel(index) {
  bodyOff("rewarding");
  player.inspecting = false;
  clearInspectTarget();
  stopHitTracking();
  off(viewport, "inspecting");

  haltTurns();
  doTurn((Math.random() * 4) | 0);
  on(viewport, "lx");
  await wait(OPTS.time.levelExitMs);

  startLevel(index);

  off(viewport, "lx");
  on(viewport, "le");
  void world.offsetWidth;
  on(viewport, "li");
  await wait(OPTS.time.levelEnterMs);
  off(viewport, "le", "li");
}

function startLevel(index) {
  const exclude = cubeRack.completed();
  const L = buildLevel(index, exclude);
  if (!L.colors.length) {
    endGameWon();
    return;
  }
  applyLevelMood(index);
  levelIndex = L.index;
  rooms = L.rooms;
  triangles = L.triangles;
  levelColors = L.colors;
  collected = new Set();
  solvedColors = new Set();
  haltTurns();
  player.room = 0;
  player.inspecting = false;
  player.right = [1, 0, 0];
  player.up = [0, 1, 0];
  player.forward = [0, 0, -1];

  puzzles?.destroy();
  puzzles = createPuzzleSet(L.colors, L.perColor, onColorComplete);

  clearAllHintMasks();
  world.replaceChildren(...rooms.map(buildRoom));
  updateView(false);
  if (index === 0 && powerState.wash.level < 1) powerState.wash.level = 1;
  powers.syncAll();
}

function passageTarget() {
  const dir = facingFaceKey();
  if (dir === "U" || dir === "D") return null;
  const to = rooms[player.room].doors[dir];
  return to === undefined ? null : to;
}

function getFacingFaceEl() {
  const key = facingFaceKey();
  return qs(
    `#room-${player.room} .face[data-face="${key}"]`
  );
}

function updateView(animate = true) {
  tog(world, "na", !animate);
  tog(camera, "na", !animate);

  if (!turnBusy) look();
  const r = rooms[player.room];
  if (!r) return;
  world.style.transform = `translate3d(calc(${-r.x} * var(--span)), 0px, calc(${-r.z} * var(--span)))`;
  tog(viewport, "inspecting", player.inspecting);
}

function navigateFromView(applyBasis, axis, s) {
  const kick = () => {
    const fr = [...player.right],
      fu = [...player.up],
      ff = [...player.forward];
    applyBasis();
    animateTurn(fr, fu, ff, axis, s);
  };

  if (!player.inspecting) {
    kick();
    return;
  }

  turnBusy = 1;
  const face = inspectFace();
  const layers = faceLayers(face);
  stopHitTracking();
  resetRevealMask();
  layers.forEach(resetLayerMask);
  player.inspecting = false;
  clearInspectTarget();

  off(camera, "na");
  off(world, "na");
  off(viewport, "inspecting");

  onceEndOrTimeout(
    camera,
    OPTS.time.camMs + 80,
    () => {
      turnBusy = 0;
      kick();
    },
    (e) => e.target === camera && e.propertyName === "transform"
  );
}

const TURNS = [
  ["up", "right", 1],
  ["up", "right", -1],
  ["right", "up", -1],
  ["right", "up", 1],
];
const doTurn = (i) => {
  if (turnBusy || walkBusy) return turnQ.length < 8 && turnQ.push(i);
  const [ax, other, s] = TURNS[i];
  const axis = player[ax];
  navigateFromView(() => {
    player.forward = rot90(player.forward, axis, s);
    player[other] = rot90(player[other], axis, s);
  }, axis, s);
};

function clearInspectTarget() {
  qsa(".face.it").forEach((f) => off(f, "it"));
}

let hitRaf = null;
let inspectHits = [];

function stopHitTracking() {
  if (hitRaf != null) {
    cancelAnimationFrame(hitRaf);
    hitRaf = null;
  }
  inspectHits = [];
  inspectStage.hidden = true;
  inspectStage.replaceChildren();
}

function trackInspectHits(layers) {
  stopHitTracking();
  if (!layers.length) return;

  inspectHits = layers.map((layer) => {
    const hit = button({
      className: "ihit",
    });
    hit.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!layer.dataset.id) return;
      collectTriangle(layer.dataset.id, layer);
    });
    return { hit, layer };
  });

  inspectStage.hidden = false;
  inspectStage.replaceChildren(...inspectHits.map((h) => h.hit));

  const sync = () => {
    if (!player.inspecting || !inspectHits.length) return;
    const stage = inspectStage.getBoundingClientRect();
    const pad = 6;
    for (const { hit, layer } of inspectHits) {
      const poly = layer.querySelector(".ctri");
      const face = layer.closest(".face");
      const target = poly || face || layer;
      const r = target.getBoundingClientRect();
      box(hit, {
        x: r.left - stage.left - pad,
        y: r.top - stage.top - pad,
        w: Math.max(12, r.width + pad * 2),
        h: Math.max(12, r.height + pad * 2),
      });
    }
    hitRaf = requestAnimationFrame(sync);
  };

  hitRaf = requestAnimationFrame(sync);
}

function enterInspect() {
  if (passageTarget() !== null) return;
  pruneWashes();
  player.inspecting = true;
  clearInspectTarget();

  const face = getFacingFaceEl();
  if (face) {
    on(face, "it");
    const layers = faceLayers(face);
    if (layers.length) {
      playRevealMask(layers);
      trackInspectHits(layers);
    } else {
      stopHitTracking();
    }
  }

  updateView();
}

function exitInspect() {
  const face = inspectFace();
  const layers = faceLayers(face);

  player.inspecting = false;
  stopHitTracking();
  updateView();

  if (layers.length) {
    playHideMask(layers, () => {
      off(face, "it");
    });
  } else {
    clearInspectTarget();
    resetRevealMask();
  }
}

function primaryAction() {
  if (turnBusy) return;
  if (player.inspecting) {
    exitInspect();
    return;
  }
  const to = passageTarget();
  if (to !== null) {
    player.room = to;
    walkBusy = 1;
    const gen = ++walkGen;
    updateView();
    setTimeout(() => {
      if (gen !== walkGen) return;
      walkBusy = 0;
      pumpQ();
    }, 780);
    return;
  }
  enterInspect();
}

function claimTriangle(id, el) {
  if (collected.has(id)) return null;
  const tri = triangles.find((t) => t.id === id);
  if (!tri) return null;
  collected.add(id);
  const layer =
    el?.closest?.(".cl") ||
    el ||
    layerById(id);
  const face = layer?.closest?.(".face");
  powers.noteCollected(id);
  if (layer) layer.style.visibility = "hidden";
  return { tri, layer, face };
}

function collectTriangle(id, el) {
  const claim = claimTriangle(id, el);
  if (!claim) return;
  const { tri, layer, face } = claim;
  const others = face
    ? faceLayers(face).filter((l) => l !== layer)
    : [];

  if (player.inspecting && others.length) {
    for (const l of others) {
      const c = l.querySelector(".rc");
      setCircleR(c, R_MAX);
      on(l, "revealed");
      off(l, "revealing", "hiding");
      l.style.filter = "none";
    }
    revealLayers = others;
    trackInspectHits(others);
  } else {
    stopHitTracking();
    resetRevealMask();
    player.inspecting = false;
    clearInspectTarget();
    updateView();
  }

  puzzles?.flyIn(id, layer, tri.color);
}

window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (bodyHas("rewarding") || bodyHas("won")) return;
  const powerId = POWER_KEY[e.key.toLowerCase()];
  if (powerId) {
    e.preventDefault();
    powers.activatePower(powerId);
    return;
  }
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    primaryAction();
    return;
  }
  const map = {
    ArrowLeft: 0,
    ArrowRight: 1,
    ArrowUp: 2,
    ArrowDown: 3,
  };
  if (map[e.key] != null) {
    e.preventDefault();
    if (!e.repeat) doTurn(map[e.key]);
  }
});

ensureRevealDefs();
startLevel(0);
showHelp();

</script>
</body>
</html>
