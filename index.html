  const pts = [];
  for (let j = 0; j <= n; j++)

      if (j && j < n) y += (rand() - 0.5) * (ys[j] - ys[j - 1]) * 0.45;

      const a = at(i, j);
      const b = at(i + 1, j);
      const c = at(i + 1, j + 1);
      const d = at(i, j + 1);
      if (rand() < 0.5) tris.push([a, b, c], [a, c, d]);

const shuffle = (a) => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const tutorialRooms = () => [
  { id: 0, x: 0, z: 0, doors: { N: 1 } },
  { id: 1, x: 0, z: -1, doors: { S: 0 } },
];

const mazeRooms = (cols, rows = cols) => {
  const { doors } = generateMaze(cols, rows);
  return doors.map((d, id) => {
    const { row, col } = indexToRC(id, cols);
    return {
      id,
      x: col,
      z: row,
      doors: { ...d },
    };
  });
};

const pickLevelColors = (count, exclude = [], lit = () => 0) => {
  const ban = new Set(exclude);
  return RAINBOW.filter((c) => !ban.has(c.i))
    .sort((a, b) => lit(a.i) - lit(b.i) || a.i - b.i)
    .slice(0, count);
};

const placeTriangles = (rooms, colors, perColor = O.per) => {
  const slots = [];
  for (const r of rooms) {
    for (const face of ["N", "E", "S", "W", "U", "D"]) {
      if (face in r.doors) continue;
      slots.push({ room: r.id, face });
    }
  }
  shuffle(slots);
  const tris = [];
  let i = 0;
  for (const color of colors) {
    for (let n = 0; n < perColor; n++) {
      const s = slots[i % slots.length];
      i++;
      tris.push({
        id: `t${tris.length}`,
        room: s.room,
        face: s.face,
        color,
      });
    }
  }
  return tris;
};

const buildLevel = (index, exclude = [], lit = () => 0) => {
  const raw = O.defs[index] || [O.maxC, 1 + index];
  const cols = raw[0] <= 0 ? 0 : Math.min(O.maxC, raw[0]);
  const rows = cols ? Math.min(O.maxR, raw[2] || raw[0]) : 0;
  const rooms = cols ? mazeRooms(cols, rows) : tutorialRooms();
  const colors = pickLevelColors(Math.min(6, raw[1] || 1), exclude, lit);
  return {
    index,
    rooms,
    colors,
    triangles: colors.length ? placeTriangles(rooms, colors) : [],
    perColor: O.per,
  };
};

const CUBE_FACES = 6;

const CUBE_TURNS = [
  [0, 0],
  [90, 0],
  [180, 0],
  [270, 0],
  [0, 90],
  [0, -90],
];

const cubeFill = (c) =>
  colorHsl({ ...c, l: Math.max(c.l, O.minL) });

const makeGem = (color, slot) => {
  const fill = cubeFill(color);
  const cubeFace = slot?.querySelector?.(".cf");
  const endSize = Math.max(
    16,
    cubeFace?.getBoundingClientRect?.().width ||
      (slot ? rect(slot).width : 52) * 0.34
  );
  const gem = div({ className: "gem" });
  gem.style.setProperty("--fly", fill);
  gem.style.background = fill;
  box(gem, { w: endSize, h: endSize });
  return { gem, fill, endSize };
};

function createCube({ color, lit = [], pd = [] }) {
  const litSet = new Set(lit);
  const pending = new Set(pd);
  const fill = cubeFill(color);

  const faces = CUBE_TURNS.map(([ry, rx], i) => {
    const isPending = pending.has(i);
    const on = litSet.has(i) && !isPending;
    const face = div({
      className: on ? "cf lit" : isPending ? "cf pd" : "cf",
      style: {
        background: on ? fill : "#3a3a42",
        transform: `rotateY(${ry}deg) rotateX(${rx}deg) translateZ(1em)`,
      },
    });
    face.dataset.i = String(i);
    return face;
  });

  return div({ className: "cube", style: { "--cube": fill } }, ...faces);
}

function createCubeRack() {
  const litByColor = RAINBOW.map(() => new Set());

  const slots = RAINBOW.map((c, i) => {
    const slot = div({
      className: "ds",
      style: { ...toneStyle("slot", c), "--slot": cubeFill(c), "--d": i * 0.2 + "s" },
    });
    return slot;
  });

  const rack = div({ id: "drk" }, ...slots);
  document.body.append(rack);

  const slotFor = (color) => slots[color.i];

  function paint(rainbow, pendingFaces = []) {
    const slot = slots[rainbow.i];
    if (!slot) return null;
    const lit = litByColor[rainbow.i];
    if (!lit.size && !pendingFaces.length) {
      slot.replaceChildren();
      return slot;
    }
    const pending = new Set(pendingFaces);
    slot.replaceChildren(
      createCube({
        color: rainbow,
        lit: [...new Set([...lit, ...pending])],
        pd: [...pending],
      })
    );
    return slot;
  }

  const nextFace = (i) => {
    const lit = litByColor[i];
    for (let f = 0; f < CUBE_FACES; f++) if (!lit.has(f)) return f;
    return -1;
  };

  function igniteFace(slot, faceIndex) {
    const face = slot?.querySelector?.(`.cf[data-i="${faceIndex}"]`);
    if (!face) return;
    off(face, "pd");
    void face.offsetWidth;
    on(face, "lit", "ig");
    const fill = slot.querySelector(".cube")?.style.getPropertyValue("--cube");
    if (fill) face.style.background = fill;
  }

  const retireFull = (rainbow, slot, gemEl) => {
    paint(rainbow);
    gemEl?.remove();
    retireColorFromLevel(rainbow.i);
    return slot;
  };

  async function deliver(color, gemEl) {
    const slot = slotFor(color);
    if (!slot) return null;
    const face = nextFace(color.i);
    if (face < 0) return retireFull(color, slot, gemEl);
    await flyThen(gemEl, slot, { node: gemEl, ms: O.tfly, sfx: sfxReward });
    if (isWon()) return null;
    return settleFace(color, face);
  }

  async function settleFace(rainbow, faceIndex) {
    litByColor[rainbow.i].add(faceIndex);
    const slot = paint(rainbow, [faceIndex]);
    await nextFrame();
    igniteFace(slot, faceIndex);
    if (isFull(rainbow.i)) retireColorFromLevel(rainbow.i);
    if (allComplete()) endGameWon();
    else powers.syncAll();
    return slot;
  }

  const litCount = () => {
    let n = 0;
    for (const s of litByColor) n += s.size;
    return n;
  };

  function rallyRoom(spare = 1) {
    let open = 0;
    for (const s of litByColor) {
      if (s.size > 0 && s.size < CUBE_FACES) open += CUBE_FACES - s.size;
    }
    return Math.max(0, Math.min(open, RAINBOW.length * CUBE_FACES - spare - litCount()));
  }

  async function addFaces(n, spare = 0) {
    const picks = [];
    const incoming = RAINBOW.map(() => []);
    for (let i = 0; i < Math.max(0, n); i++) {
      if (rallyRoom(spare) <= 0) break;
      const targets = RAINBOW.filter(
        (c) => litByColor[c.i].size > 0 && !isFull(c.i)
      );
      if (!targets.length) break;
      const c = targets.sort(
        (a, b) => litByColor[a.i].size - litByColor[b.i].size
      )[0];
      const f = nextFace(c.i);
      if (f < 0) continue;
      litByColor[c.i].add(f);
      incoming[c.i].push(f);
      paint(c, incoming[c.i]);
      picks.push([c, f]);
    }
    await Promise.all(
      picks.map(([c, f]) => {
        const slot = slotFor(c);
        const { gem } = makeGem(c, slot);
        return flyIn(null, slot, { node: gem, sfx: sfxReward }, () => {
          if (isWon()) return;
          igniteFace(slot, f);
          if (isFull(c.i)) retireColorFromLevel(c.i);
        });
      })
    );
    if (allComplete()) endGameWon();
    else powers.syncAll();
    return picks.length;
  }

  const isFull = (i) => litByColor[i].size >= CUBE_FACES;
  const isColorComplete = (color) => isFull(color.i);
  const completed = () => RAINBOW.filter((c) => isFull(c.i)).map((c) => c.i);
  const allComplete = () => RAINBOW.every((c) => isFull(c.i));

  return {
    slots,
    deliver,
    addFaces,
    rallyRoom,
    isColorComplete,
    lit: (i) => litByColor[i].size,
    completed,
    allComplete,
  };
}

const W = 0,
  E = 1,
  R = 2;
const POWERS = [
  ["W", uniCyan],
  ["E", uniPink],
  ["R", uniGold],
];
const PK = { w: W, e: E, r: R };
const PCD = [
  [24e3, 4e3, 5e3],
  [48e3, 4e3, 16e3],
  [12e4, 16e3, 28e3],
];
const powStyle = (fill) => ({
  "--pow": `color-mix(in srgb, ${fill} 65%, #000)`,
  "--powd": `color-mix(in srgb, ${fill} 27%, #201018)`,
});

const powerState = [
  { l: 0, a: 0, c: 0 },
  { l: 0, a: 0, c: 0 },
  { l: 0, a: 0, c: 0 },
];

const lv1 = (n) => Math.max(1, n | 0);
const powerCd = (id, level) => {
  const [base, step, min] = PCD[id];
  return Math.max(min, base - (lv1(level) - 1) * step);
};

const powerBtn = ([glyph, fill], n, extra) => {
  const btn = button({
    className: extra ? `ps ${extra}` : "ps",
    style: powStyle(fill),
  });
  btn.append(div({ className: "pg" }, glyph), div({ className: "pl" }, String(n)));
  return btn;
};

let upgradeQueue = Promise.resolve();
let upgradeWait = 0;

function createPowerSystem() {
  const slots = POWERS.map((p, id) => {
    const slot = powerBtn(p, 0, "lk");
    slot.disabled = true;
    slot.onclick = () => activatePower(id);
    return slot;
  });
  document.body.append(div({ id: "prk" }, ...slots));

  const gate = (id) => (id === R ? levelIndex >= O.rallyLv : true);
  const unlocked = (id) => powerState[id].l > 0 && gate(id);

  const openPool = () => {
    const ids = new Set(levelColors.map((c) => c.i));
    return triangles.filter((t) => {
      const el = layerById(t.id);
      return (
        !collected.has(t.id) &&
        ids.has(t.color.i) &&
        el && !isHid(el)
      );
    });
  };

  function syncSlot(id) {
    const st = powerState[id];
    const slot = slots[id];
    slot.querySelector(".pl").textContent = String(st.l);
    const lock = !unlocked(id);
    const empty =
      !lock &&
      ((id === E && !openPool().length) || (id === R && !(cubeRack.rallyRoom() > 0)));
    const held = hasRw();
    tog(slot, "lk", lock || empty);
    tog(slot, "on", st.a);
    tog(slot, "co", st.c);
    slot.disabled = lock || empty || st.a || st.c || held;
  }
  const syncAll = () => POWERS.forEach((_, id) => syncSlot(id));

  function beginBusy(id, activeMs) {
    const st = powerState[id];
    st.a = st.c = true;
    syncSlot(id);
    const cd = powerCd(id, st.l);
    setTimeout(() => {
      st.a = false;
      syncSlot(id);
    }, Math.min(activeMs, cd));
    setTimeout(() => {
      st.c = false;
      syncSlot(id);
    }, cd);
  }

  function showUpgrade() {
    return new Promise((resolve) => {
      if (isWon()) {
        upgradeWait--;
        resolve();
        return;
      }
      const canPick = (id) => gate(id);
      let picked = false;
      let onKey;

      const choices = POWERS.map((p, id) => {
        const ok = canPick(id);
        const btn = powerBtn(p, "+", ok ? "ppk" : "ppk lk");
        btn.disabled = !ok;
        if (ok) btn.onclick = () => commit(id);
        return btn;
      });
      const modal = showModal(div({ className: "ppks" }, ...choices), 4 / 3);
      syncAll();

      const finish = (id) => {
        upgradeWait--;
        if (isWon()) {
          resolve(id);
          return;
        }
        if (upgradeWait > 0) {
          resolve(id);
          return;
        }
        modal?.remove();
        bodyOff("rw");
        syncAll();
        resolve(id);
      };
      const close = (id) => {
        if (picked || isWon()) return;
        picked = true;
        removeEventListener("keydown", onKey);
        const more = upgradeWait > 1;
        if (!more) on(modal, "out");
        setTimeout(() => finish(id), more ? 400 : 520);
      };
      const commit = (id) => {
        if (picked || isWon() || !canPick(id)) return;
        sfxReward(16 / 9);
        on(choices[id], "pk");
        close(id);
        powerState[id].l++;
        syncSlot(id);
      };

      onKey = (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const id = PK[e.key.toLowerCase()];
        if (id == null) return;
        e.preventDefault();
        commit(id);
      };
      addEventListener("keydown", onKey);
    });

  const offerUpgrade = () => {
    if (isWon()) return Promise.resolve();
    upgradeWait++;
    const p = upgradeQueue.then(showUpgrade, showUpgrade);
    upgradeQueue = p.catch(() => {});
    return p;

    syncAll();
  }

  function runWash(level) {
    const facing = facingFaceKey();
    const opp = { N: "S", S: "N", E: "W", W: "E" }[facing];
    const all = openPool();
    const pool = opp
      ? all.filter((t) => !(t.room === player.room && t.face === opp))
      : all;
    const picks = shuffle((pool.length ? pool : all).slice()).slice(0, lv1(level));

    picks.forEach((t) => {
      if (collected.has(t.id)) return;
      const layer = layerById(t.id);
      if (!layer || isHid(layer)) return;
      playWash(layer, colorHsl(colorPair(t.color)));

  }

  function runEvoke(level) {
    const pool = openPool();
    if (!pool.length) return;
    const i = shuffle([...new Set(pool.map((t) => t.color.i))])[0];
    const picks = shuffle(pool.filter((t) => t.color.i === i)).slice(0, lv1(level));
    const puzzle = puzzles.map[i];
    if (!puzzle) return;

    picks.forEach((t) => {
      const claim = claimTriangle(t.id);
      if (!claim) return;
      const { layer } = claim;
      if (!layer) return void puzzle.addPieceToTray(t.id);
      flyIn(layer, puzzle.tab, { fill: colorHsl(t.color) }, () =>
        puzzle.addPieceToTray(t.id)
      );
    });

  }

  function runRally(n) {
    if (!(cubeRack.rallyRoom() > 0)) return;
    Promise.resolve(cubeRack.addFaces(n, 1)).then(() => {
      syncAll();
      if (levelCleared()) transitionToLevel(levelIndex + 1);
    });
  }

  function activatePower(id) {
    const st = powerState[id];
    if (!unlocked(id) || st.a || st.c || hasRw() || isWon()) return;
    if (id === E && !openPool().length) return;
    if (id === R && !(cubeRack.rallyRoom() > 0)) return;

    uniGo();

    if (id === R) {
      runRally(lv1(st.l));
      beginBusy(id, O.tfly + 400);
    } else {
      if (id === W) runWash(st.l);
      else runEvoke(st.l);
      beginBusy(id, 900);
    }
  }

  syncAll();
  return {
    offerUpgrade,
    activatePower,
    syncAll,
    noteCollected,
  };
}

function facingFaceKey() {
  const [fx, fy, fz] = player.forward;
  const ax = Math.abs(fx);
  const ay = Math.abs(fy);
  const az = Math.abs(fz);
  if (ay >= ax && ay >= az) return fy > 0 ? "U" : "D";
  if (ax >= az) return fx > 0 ? "E" : "W";
  return fz < 0 ? "N" : "S";
}

function buildRoom(spec) {
  const walls = [...FACE_KEYS]
    .filter((key) => !(key in spec.doors))
    .map((key) => {
      const face = div({ className: "face" });
      face.dataset.f = key;
      const hides = hiddensOn(spec.id, key);
      paintWall(
        face,
        hides.map((h) => ({ id: h.id, color: h.color }))
      );
      return div({ className: `wall f${key.toLowerCase()}` }, face);
    });

  return div(
    {
      id: `r${spec.id}`,
      className: "room",
      style: {
        transform: `translate3d(calc(${spec.x} * var(--S)), 0px, calc(${spec.z} * var(--S)))`,
      },
    },
    ...walls
  );
}

const world = div({ id: "w" });
const pivot = div({ id: "pv" }, world);
const camera = div({ id: "cam" }, pivot);
const viewport = div({ id: "vp" }, camera);
const inspectStage = div({ id: "is", hidden: true });

document.body.append(viewport, inspectStage);

let chromeless;
const tryChromeless = () => {
  if (chromeless++ || !matchMedia("(hover:none)").matches) return;
  document.documentElement.requestFullscreen?.().catch?.(() => {});
};

viewport.addEventListener("click", (e) => {
  tryChromeless();
  if (turnBusy || hasRw() || isWon()) return;
  const r = rect(viewport);
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top) / r.height;
  const t = 1 / 3;
  if (x < t || x > 1 - t || y < t || y > 1 - t) {
    const dx = Math.abs(x - 0.5);
    const dy = Math.abs(y - 0.5);
    if (dx >= dy) return doTurn(+(x > 0.5));
    return doTurn(2 + +(y > 0.5));
  }
  primaryAction();
});

const cubeRack = createCubeRack();
const powers = createPowerSystem();

function levelCleared() {
  return (
    triangles.every((t) => collected.has(t.id)) &&
    levelColors.every((c) => solvedColors.has(c.i))
  );
}

function retireColorFromLevel(i) {
  if (i == null) return;
  solvedColors.add(i);
  let stripped = false;
  for (const t of triangles) {
    if (t.color.i !== i) continue;
    clearHintMask(t.id);
    if (collected.has(t.id)) continue;
    collected.add(t.id);
    layerById(t.id)?.remove();
    stripped = true;
  }
  puzzles?.map?.[i]?.remove();
  if (puzzles?.map) delete puzzles.map[i];
  levelColors = levelColors.filter((c) => c.i !== i);
  if (stripped && player.ins) {
    const layers = faceLayers(inspectFace());
    if (layers.length) trackInspectHits(layers);
    else stopHitTracking();
  }
  powers.syncAll();
}

let rewardInflight = 0;

async function onColorComplete(color, puzzle) {
  if (isWon()) return;
  rewardInflight++;
  solvedColors.add(color.i);
  sfxReward(3 / 4, 0.2);
  try {
    const left = triangles.filter(
      (t) => t.color.i === color.i && !collected.has(t.id)
    ).length;

    await wait(O.hold);
    if (isWon()) return;

    const gem = await puzzle.collapseToGem();
    if (isWon()) return;
    await cubeRack.deliver(color, gem);
    if (isWon() || cubeRack.allComplete()) {
      endGameWon();
      return;
    }

    if (cubeRack.isColorComplete(color)) {
      retireColorFromLevel(color.i);
    } else if (left >= O.per) {
      puzzle.reset();
    } else {
      puzzle.remove();
    }

    await wait(300);
    if (isWon()) return;
    await powers.offerUpgrade();
    if (isWon() || rewardInflight > 1) return;

    if (cubeRack.allComplete()) {
      endGameWon();
      return;
    }
    if (levelCleared()) await transitionToLevel(levelIndex + 1);
  } finally {
    rewardInflight--;
    if (!isWon() && !qs(".pmod")) bodyOff("rw");
    powers.syncAll();
  }
}

let t0, tid;
const tcl = div({ id: "tcl" });
const tFmt = (s) =>
  ((s / 60 | 0) + 100 + "").slice(1) + ":" + ((s % 60) + 100 + "").slice(1);
const tTick = () => (tcl.textContent = tFmt(((Date.now() - t0) / 1e3) | 0));
const tStart = () => {
  t0 = Date.now();
  tid = setInterval(tTick, 1e3);
  tTick();
};
const tStop = () => clearInterval(tid);

function endGameWon() {
  if (isWon()) return;
  tStop();
  bodyOn("won");
  qs(".pmod")?.remove();
  bodyOff("rw");
  document.body.append(div({ id: "win" }, "Winner!"));
  musicWin();
  cubeRack.slots.forEach((_, i) =>
    setTimeout(() => sfxReward(4 / 3), i * 200)
  );
  powers.syncAll();
}

function showHelp() {
  bodyOn("hi");
  const modal = showModal([
    v.h2(
      { className: "ph" },
      "Find the Rainbow's Triangles"
    ),
    div(
      { className: "ph" },
      "Tap edges or arrows to turn\nTap center or space to move\nW / E / R are powerups"
    ),
  ]);
  const go = () => {
    tryChromeless();
    removeEventListener("keydown", go);
    modal.onclick = null;
    on(modal, "out");
    setTimeout(() => {
      modal.remove();
      bodyOff("rw", "hi");
      powers.syncAll();
      tStart();
    }, 520);
  };
  addEventListener("keydown", go);
  modal.onclick = go;
}

async function transitionToLevel(index) {
  bodyOff("rw");
  player.ins = false;
  clearInspectTarget();
  stopHitTracking();
  off(viewport, "ins");
  off(uni, "act");

  haltTurns();
  doTurn((Math.random() * 4) | 0);
  on(viewport, "lx");
  await wait(O.lx);

  on(viewport, "le");
  startLevel(index);
  isWon() || musicRand();
  off(viewport, "lx");
  void world.offsetWidth;
  on(viewport, "li");
  await wait(O.li);
  off(viewport, "le", "li");
}

function startLevel(index) {
  const L = buildLevel(index, cubeRack.completed(), cubeRack.lit);
  if (!L.colors.length) {
    endGameWon();
    return;
  }
  applyLevelMood(index);
  levelIndex = L.index;
  rooms = L.rooms;
  triangles = L.triangles;
  levelColors = L.colors;
  collected = new Set();
  solvedColors = new Set();
  haltTurns();
  player.room = 0;
  player.ins = false;
  player.right = [1, 0, 0];
  player.up = [0, 1, 0];
  player.forward = [0, 0, -1];

  puzzles?.destroy();
  puzzles = createPuzzleSet(L.colors, L.perColor, onColorComplete);

  clearAllHintMasks();
  world.replaceChildren(...rooms.map(buildRoom));
  updateView(false);
  if (index === 0 && powerState[0].l < 1) powerState[0].l = 1;
  powers.syncAll();
}

function passageTarget() {
  const dir = facingFaceKey();
  if (dir === "U" || dir === "D") return null;
  const to = rooms[player.room].doors[dir];
  return to === undefined ? null : to;
}

function getFacingFaceEl() {
  const key = facingFaceKey();
  return qs(`#r${player.room} .face[data-f="${key}"]`);
}

function updateView(animate = true) {
  tog(world, "na", !animate);
  tog(camera, "na", !animate);

  if (!turnBusy) look();
  const r = rooms[player.room];
  if (!r) return;
  world.style.transform = `translate3d(calc(${-r.x} * var(--S)), 0px, calc(${-r.z} * var(--S)))`;
  tog(viewport, "ins", player.ins);
  tog(uni, "act", player.ins);
}

function navigateFromView(applyBasis, axis, s) {
  const kick = () => {
    const fr = [...player.right],
      fu = [...player.up],
      ff = [...player.forward];
    applyBasis();
    animateTurn(fr, fu, ff, axis, s);
  };

  if (!player.ins) {
    kick();
    return;
  }

  turnBusy = 1;
  const face = inspectFace();
  const layers = faceLayers(face);
  stopHitTracking();
  resetRevealMask();
  layers.forEach(resetLayerMask);
  player.ins = false;
  clearInspectTarget();

  off(camera, "na");
  off(world, "na");
  off(viewport, "ins");
  off(uni, "act");

  onceEndOrTimeout(
    camera,
    O.cam + 80,
    () => {
      turnBusy = 0;
      kick();
    },
    (e) => e.target === camera && e.propertyName === "transform"
  );
}

const TURNS = [
  ["up", "right", 1],
  ["up", "right", -1],
  ["right", "up", -1],
  ["right", "up", 1],
];
const doTurn = (i) => {
  if (turnBusy || walkBusy) return turnQ.length < 8 && turnQ.push(i);
  const [ax, other, s] = TURNS[i];
  const axis = player[ax];
  navigateFromView(() => {
    player.forward = rot90(player.forward, axis, s);
    player[other] = rot90(player[other], axis, s);
  }, axis, s);
};

function clearInspectTarget() {
  qsa(".face.it").forEach((f) => off(f, "it"));
}

let hitRaf = null;
let inspectHits = [];

function stopHitTracking() {
  if (hitRaf != null) {
    cancelAnimationFrame(hitRaf);
    hitRaf = null;
  }
  inspectHits = [];
  inspectStage.hidden = true;
  inspectStage.replaceChildren();
}

function trackInspectHits(layers) {
  stopHitTracking();
  if (!layers.length) return;

  inspectHits = layers.map((layer) => {
    const hit = button({
      className: "ihit",
    });
    hit.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!layer.dataset.id) return;
      collectTriangle(layer.dataset.id, layer);
    });
    return { hit, layer };
  });

  inspectStage.hidden = false;
  inspectStage.replaceChildren(...inspectHits.map((h) => h.hit));

  const sync = () => {
    if (!player.ins || !inspectHits.length) return;
    const stage = rect(inspectStage);
    const pad = 6;
    for (const { hit, layer } of inspectHits) {
      const poly = layer.querySelector(".ctri");
      const face = layer.closest(".face");
      const target = poly || face || layer;
      const r = rect(target);
      box(hit, {
        x: r.left - stage.left - pad,
        y: r.top - stage.top - pad,
        w: Math.max(12, r.width + pad * 2),
        h: Math.max(12, r.height + pad * 2),
      });
    }
    hitRaf = requestAnimationFrame(sync);
  };

  hitRaf = requestAnimationFrame(sync);
}

function enterInspect() {
  if (passageTarget() !== null) return;
  pruneWashes();
  player.ins = true;
  clearInspectTarget();

  const face = getFacingFaceEl();
  if (face) {
    on(face, "it");
    const layers = faceLayers(face);
    if (layers.length) {
      playRevealMask(layers);
      trackInspectHits(layers);
    } else {
      stopHitTracking();
    }
  }

  updateView();
}

function exitInspect() {
  const face = inspectFace();
  const layers = faceLayers(face);

  player.ins = false;
  stopHitTracking();
  updateView();

  if (layers.length) {
    playHideMask(layers, () => {
      off(face, "it");
    });
  } else {
    clearInspectTarget();
    resetRevealMask();
  }
}

function primaryAction() {
  if (turnBusy) return;
  if (player.ins) {
    exitInspect();
    return;
  }
  const to = passageTarget();
  if (to !== null) {
    player.room = to;
    walkBusy = 1;
    const gen = ++walkGen;
    updateView();
    setTimeout(() => {
      if (gen !== walkGen) return;
      walkBusy = 0;
      pumpQ();
    }, 780);
    return;
  }
  enterInspect();
}

function claimTriangle(id, el) {
  if (collected.has(id)) return null;
  const tri = triangles.find((t) => t.id === id);
  if (!tri) return null;
  collected.add(id);
  const layer =
    el?.closest?.(".cl") ||
    el ||
    layerById(id);
  const face = layer?.closest?.(".face");
  powers.noteCollected(id);
  if (layer) hide(layer);
  return { tri, layer, face };
}

function collectTriangle(id, el) {
  const claim = claimTriangle(id, el);
  if (!claim) return;
  const { tri, layer, face } = claim;
  const others = face
    ? faceLayers(face).filter((l) => l !== layer)
    : [];

  if (player.ins && others.length) {
    for (const l of others) {
      const c = l.querySelector(".rc");
      setCircleR(c, R_MAX);
      on(l, "rd");
      off(l, "rv", "hd");
    }
    revealLayers = others;
    trackInspectHits(others);
  } else {
    stopHitTracking();
    resetRevealMask();
    player.ins = false;
    clearInspectTarget();
    updateView();
  }

  puzzles?.flyIn(id, layer, tri.color);
}

window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (hasRw() || isWon()) return;
  const powerId = PK[e.key.toLowerCase()];
  if (powerId != null) {
    e.preventDefault();
    powers.activatePower(powerId);
    return;
  }
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    primaryAction();
    return;
  }
  const d = { Left: 0, Right: 1, Up: 2, Down: 3 }[e.key.slice(5)];
  if (d != null) {
    e.preventDefault();
    if (!e.repeat) doTurn(d);
  }
});

ensureRevealDefs();
document.body.append(tcl);
startLevel(0);
showHelp();

</script>
</body>
</html>
