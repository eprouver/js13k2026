  const c2y = y1 + dy * 0.7 + ny * j * -side * (0.3 + Math.random() * 0.5);
  return `M ${x1} ${y1} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`;

const flyOnPath = (fromEl, toEl, opts = {}) =>
  new Promise((resolve) => {
    const node = opts.node;
    if (!toEl || (node != null && !node)) {
      if (!node) fromEl?.remove?.();
      resolve();
      return;
    }

    const b = toEl.getBoundingClientRect();
    const { x: x1, y: y1 } = flyStartPoint(fromEl, opts, node);
    const x2 = b.left + b.width / 2;
    const y2 = b.top + b.height / 2;
    const ms = opts.ms ?? (node ? OPTS.fly.trophyMs : OPTS.fly.ms);
    const delay = opts.delay ?? 0;

    const mover = div({
      className: node ? "fly flyn" : "fly",
    });
    mover.style.offsetPath = `path("${generatePathData(x1, y1, x2, y2)}")`;
    mover.style.offsetDistance = "0%";
    mover.style.animationDuration = `${ms}ms`;
    mover.style.animationDelay = `${delay}ms`;

    if (node) {
      if (node.style) {
        node.style.position = "";
        node.style.left = "";
        node.style.top = "";
        node.style.zIndex = "";
      }
      mover.append(node);
    } else {
      const size = opts.fromOffscreen ? 34 : 28;
      mover.style.setProperty("--fly", opts.fill || "gold");
      mover.style.width = `${size}px`;
      mover.style.height = `${size}px`;

    const finish = () => {
      if (done) return;
      done = true;
      mover.remove();
      if (!node) fromEl?.remove?.();

    mover.addEventListener("animationend", finish, { once: true });
    setTimeout(finish, delay + ms + 120);
    document.body.append(mover);

const buildMesh = (rand, n = 3) => {
  const xs = [0];
  const ys = [0];
  const xw = [];
  const yw = [];
  let wx = 0;
  let wy = 0;
  for (let i = 0; i < n; i++) {
    const a = 0.5 + rand();
    const b = 0.5 + rand();
    xw.push(a);
    yw.push(b);
    wx += a;
    wy += b;
  }
  for (let i = 0; i < n; i++) {
    xs.push(xs[i] + xw[i] / wx);
    ys.push(ys[i] + yw[i] / wy);
  }
  xs[n] = ys[n] = 1;
  const pts = [];
  for (let j = 0; j <= n; j++)
    for (let i = 0; i <= n; i++) {
      let x = xs[i];
      let y = ys[j];
      if (i && i < n) x += (rand() - 0.5) * (xs[i] - xs[i - 1]) * 0.45;
      if (j && j < n) y += (rand() - 0.5) * (ys[j] - ys[j - 1]) * 0.45;
      pts.push([Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))]);
    }
  const at = (i, j) => pts[j * (n + 1) + i];
  const tris = [];
  for (let j = 0; j < n; j++)
    for (let i = 0; i < n; i++) {
      const a = at(i, j);
      const b = at(i + 1, j);
      const c = at(i + 1, j + 1);
      const d = at(i, j + 1);
      if (rand() < 0.5) tris.push([a, b, c], [a, c, d]);
      else tris.push([a, b, d], [b, c, d]);
    }
  return tris;
};

const createMeshData = (seed, opts = {}) => {

};

const triCentroid = ([[x1, y1], [x2, y2], [x3, y3]]) => [
  (x1 + x2 + x3) / 3,

];

const pickCollectTris = (tris, seed, count) => {
  if (count < 1 || !tris.length) return [];
  const pick = mulberry32((seed ^ 0xc0ffee) >>> 0);
  let pool = tris.filter((t) => {
    const [cx, cy] = triCentroid(t);
    return cx > 0.18 && cx < 0.82 && cy > 0.18 && cy < 0.82;
  });
  if (!pool.length) pool = tris.slice();
  const chosen = [];
  const rest = pool.slice();
  while (chosen.length < count && rest.length)
    chosen.push(rest.splice((pick() * rest.length) | 0, 1)[0]);
  while (chosen.length < count) chosen.push(chosen[chosen.length - 1] || tris[0]);
  return chosen;
};

    onTick(easeOut3(t), t);

const asLayers = (x) => (Array.isArray(x) ? x : [x]).filter(Boolean);

function playRevealMask(layerOrLayers) {
  ensureRevealDefs();
  stopRevealRaf();
  const layers = asLayers(layerOrLayers);
  for (const prev of revealLayers) if (!layers.includes(prev)) resetLayerMask(prev);
  if (!layers.length) {
    revealLayers = [];
    return;
  }
  revealLayers = layers;
  const circles = layers.map((layer) => {
    stopHintRaf(layer);
    off(layer, "revealed", "hiding");
    on(layer, "revealing");
    return layer.querySelector(".rc");
  });
  if (circles.some((c) => !c)) return;
  const r0s = circles.map((c) => readCircleR(c, 0));
  runTween(REVEAL_MS, {
    setRaf: (id) => {
      revealRaf = id;
    },
    onTick: (eased) =>
      circles.forEach((c, i) => setCircleR(c, r0s[i] + (R_MAX - r0s[i]) * eased)),
    onDone: () =>
      layers.forEach((layer, i) => {

function playHideMask(layerOrLayers, onDone) {
  ensureRevealDefs();
  stopRevealRaf();
  const layers = asLayers(layerOrLayers);
  if (!layers.length) return void onDone?.();
  revealLayers = layers;
  const circles = layers.map((layer) => {
    off(layer, "revealed", "revealing");
    on(layer, "hiding");
    return layer.querySelector(".rc");
  });
  if (circles.some((c) => !c)) return void onDone?.();
  const r0s = circles.map((c) => readCircleR(c, R_MAX));
  const dur = Math.max(400, HIDE_MS * (Math.max(...r0s, 1) / R_MAX));
  runTween(dur, {
    setRaf: (id) => {
      revealRaf = id;

    onTick: (eased) =>
      circles.forEach((c, i) => setCircleR(c, r0s[i] * (1 - eased))),
    onDone: () => {
      layers.forEach(resetLayerMask);
      revealLayers = [];
      onDone?.();

const indexToRC = (index, cols) => ({
  row: (index / cols) | 0,
  col: index % cols,
});

const generateMaze = (size = 5) => {
  const n = size * size;
  const doors = Array.from({ length: n }, () => ({}));
  const seen = new Uint8Array(n);
  const stack = [0];
  seen[0] = 1;
  const dirs = [
    [-1, 0, "N", "S"],
    [1, 0, "S", "N"],
    [0, -1, "W", "E"],
    [0, 1, "E", "W"],
  ];
  while (stack.length) {
    const cur = stack[stack.length - 1];
    const { row, col } = indexToRC(cur, size);
    const opts = [];
    for (const [dr, dc, d, opp] of dirs) {
      const r = row + dr;
      const c = col + dc;
      if (r < 0 || c < 0 || r >= size || c >= size) continue;
      const id = r * size + c;
      if (!seen[id]) opts.push([id, d, opp]);
    }
    if (!opts.length) {
      stack.pop();
      continue;
    }
    const [id, d, opp] = opts[(Math.random() * opts.length) | 0];
    doors[cur][d] = id;
    doors[id][opp] = cur;
    seen[id] = 1;
    stack.push(id);
  }
  return { size, doors };
};

const LEVEL_DEFS = OPTS.level.defs;

const shuffle = (a) => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const tutorialRooms = () => [
  { id: 0, x: 0, z: 0, doors: { N: 1 } },
  { id: 1, x: 0, z: -1, doors: { S: 0 } },
];

const mazeRooms = (size) => {
  const { doors } = generateMaze(size);
  return doors.map((d, id) => {
    const { row, col } = indexToRC(id, size);
    return {
      id,
      x: col,
      z: row,
      doors: { ...d },
    };
  });
};

const pickLevelColors = (count, excludeNames = []) => {
  const ban = new Set(excludeNames);
  const pool = RAINBOW.filter((c) => !ban.has(c.name));
  return shuffle(pool.slice()).slice(0, Math.min(count, pool.length));
};

const placeTriangles = (rooms, colors, perColor = PER_COLOR) => {
  const slots = [];
  for (const r of rooms) {
    for (const face of ["N", "E", "S", "W"]) {
      if (face in r.doors) continue;
      slots.push({ room: r.id, face });
    }
  }
  shuffle(slots);
  const tris = [];
  let i = 0;
  for (const color of colors) {
    for (let n = 0; n < perColor; n++) {
      const s = slots[i % slots.length];
      i++;
      tris.push({
        id: `t${tris.length}`,
        room: s.room,
        face: s.face,
        color,
      });
    }
  }
  return tris;
};

const buildLevel = (index, excludeNames = []) => {
  const maxSize = OPTS.level.maxMazeSize;
  const raw =
    LEVEL_DEFS[index] || {
      mazeSize: Math.min(maxSize, 2 + index),
      colorCount: Math.min(6, 1 + index),
    };
  const mazeSize =
    raw.mazeSize <= 0 ? 0 : Math.min(maxSize, raw.mazeSize);
  const ban = new Set(excludeNames);
  const pool = RAINBOW.filter((c) => !ban.has(c.name));
  const colorCount = Math.min(
    pool.length,
    Math.min(6, Math.max(1, raw.colorCount || 1))
  );
  const rooms = mazeSize <= 0 ? tutorialRooms() : mazeRooms(mazeSize);
  const colors = pickLevelColors(colorCount, excludeNames);
  return {
    index,
    mazeSize,
    rooms,
    colors,
    triangles: colors.length
      ? placeTriangles(rooms, colors, PER_COLOR)

  const retireFull = (rainbow, slot, gemEl) => {
    paint(rainbow);
    gemEl?.remove?.();
    retireColorFromLevel?.(rainbow.name);
    return slot;
  };

  async function deliver(color, gemEl) {
    const rainbow = toRainbow(color);
    const slot = slotFor(rainbow);
    if (!slot) return null;
    const face = nextFace(rainbow.name);
    if (face < 0) return retireFull(rainbow, slot, gemEl);
    await flyThen(gemEl, slot, { node: gemEl, ms: OPTS.fly.trophyMs });
    return settleFace(rainbow, face);
  }

  async function settleFace(rainbow, faceIndex) {
    litByColor[rainbow.name].add(faceIndex);
    const slot = paint(rainbow, [faceIndex]);
    await nextFrame();
    igniteFace(slot, faceIndex);
    if (isFull(rainbow.name)) retireColorFromLevel?.(rainbow.name);
    if (allComplete()) endGameWon?.();
    return slot;
  }

  async function flyInFace(rainbow, faceIndex, delay = 0) {
    if (isFull(rainbow.name)) return false;
    const slot = slotFor(rainbow);
    if (!slot || faceIndex < 0) return false;
    const { gem } = makeGem(rainbow, slot);
    await flyThen(null, slot, {
      node: gem,
      fromOffscreen: true,
      delay,
      ms: OPTS.fly.trophyMs,
    });
    await settleFace(rainbow, faceIndex);
    return true;
  }

  async function addFaces(n) {
    let done = 0;
    for (let i = 0; i < Math.max(0, n); i++) {
      const targets = RAINBOW.filter(
        (c) => litByColor[c.name].size > 0 && !isFull(c.name)
      );
      if (!targets.length) break;
      const c = shuffle(targets.slice())[0];
      const f = nextFace(c.name);
      if (f < 0) continue;
      await flyInFace(c, f, i === 0 ? 0 : 80);
      done++;
    }
    return done;
  }

  function openFaceCount() {
    let n = 0;
    for (const c of RAINBOW) {
      const s = litByColor[c.name].size;
      if (s > 0 && s < CUBE_FACES) n += CUBE_FACES - s;
    }
    return n;
  }

  const isFull = (name) => litByColor[name].size >= CUBE_FACES;
  const isColorComplete = (color) => isFull(toRainbow(color).name);
  const completedNames = () =>
    RAINBOW.filter((c) => isFull(c.name)).map((c) => c.name);
  const allComplete = () => RAINBOW.every((c) => isFull(c.name));

  return {
    rack,
    slots,
    deliver,
    addFaces,
    openFaceCount,
    slotFor,
    isColorComplete,
    completedNames,
    allComplete,
  };
}

/** Color bank: collect N triangles → gem. No wedge puzzle. */
function createPuzzleUI(opts) {
  const { color, total, onComplete, tabsBar } = opts;
  const fill = colorHsl(color);
  const ids = [];
  let solved = false;
  let completing = false;

  const pips = Array.from({ length: total }, () => {
    const wrap = div({ className: "tpw" });
    wrap.append(tinyPipSvg());
    return wrap;
  });
  const tab = button({ className: "ct", style: toneStyle("tab", color) });
  tab.dataset.color = color.name;
  tab.append(div({ className: "tps" }, ...pips));
  tabsBar.append(tab);

  const syncPow = () => powers?.syncAll?.();

  function refreshPips() {
    const n = ids.length;
    pips.forEach((pip, i) => {
      pip.hidden = i >= total;
      if (i < total)
        pip.querySelector("polygon")?.setAttribute(
          "fill",
          i < n ? fill : "#000"
        );
    });
    tog(tab, "ready", n >= total && !solved);
  }

  function tryComplete() {
    if (solved || completing || ids.length < total) return;
    completing = true;
    solved = true;
    on(tab, "ready");
    syncPow();
    onComplete?.();
  }

  function addPieceToTray(id) {
    if (solved || completing || ids.includes(id)) return null;
    ids.push(id);
    refreshPips();
    syncPow();
    if (ids.length >= total) tryComplete();
    return tab;
  }

  function flyIn(id, layer) {
    const run = () => addPieceToTray(id);
    if (!layer || !document.body.contains(layer)) return void run();
    flyThen(layer, tab, { fill }, run);
  }

  function reset() {
    solved = false;
    completing = false;
    ids.length = 0;
    off(tab, "ready");
    tab.hidden = false;
    refreshPips();
    syncPow();
  }

  function removeTab() {
    tab.remove();
    const root = tabsBar.closest("#proot");
    if (tabsBar && !tabsBar.childElementCount) root?.remove();
  }

  function collapseToGem() {
    return new Promise((resolve) => {
      const r = tab.getBoundingClientRect();
      const { gem, endSize } = makeGem(color, qs(".ds"));
      const startSize = Math.max(
        endSize * 1.35,
        Math.min(r.width, r.height) * 1.2 || endSize * 2
      );
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const place = (size) => {
        gem.style.width = gem.style.height = `${size}px`;
        gem.style.left = `${cx - size / 2}px`;
        gem.style.top = `${cy - size / 2}px`;
      };
      gem.style.position = "fixed";
      gem.style.zIndex = "121";
      place(startSize);
      document.body.append(gem);
      nextFrame().then(() => place(endSize));
      setTimeout(() => resolve(gem), 280);
    });
  }

  refreshPips();
  return {
    flyIn,
    addPieceToTray,
    isOpen: () => false,
    isSolved: () => solved,
    looseCount: () => (solved ? 0 : Math.max(0, total - ids.length)),
    reset,
    remove: removeTab,
    collapseToGem,
    close: () => {},
  };
}

function createPuzzleSet(colors, perColor, onColorComplete) {
  const root = div({ id: "proot" });
  const tabsBar = div({ id: "ctabs" });
  root.append(tabsBar);
  document.body.append(root);
  const map = {};
  for (const c of colors) {
    map[c.name] = createPuzzleUI({
      color: c,
      total: perColor,
      tabsBar,
      onComplete: () => onColorComplete(c, map[c.name]),
    });
  }
  return {
    map,
    root,
    flyIn: (id, layer, color) => map[color.name]?.flyIn(id, layer),
    isOpen: () => false,
    destroy() {
      Object.values(map).forEach((p) => p.remove());
      root.remove();
    },
  };
}

const POWERS = [
  ["perception", "W", 210],
  ["extraction", "E", 32],
  ["radiance", "R", 48],
];
const POWER_IDS = POWERS.map((p) => p[0]);
const POWER_KEY = { w: "perception", e: "extraction", r: "radiance" };
const powStyle = (hue) =>
  toneStyle("pow", { h: hue, s: 70, l: 55 }, { h: hue, s: 50, l: 28 });

const powerState = Object.fromEntries(
  POWER_IDS.map((id) => [id, { level: 0, active: false, cooling: false }])
);
const upgradeSkip = Object.fromEntries(POWER_IDS.map((id) => [id, 0]));
let pentagonClears = 0;

const P = () => OPTS.powers;
const lv1 = (n) => Math.max(1, n | 0);
const huntCount = (level) => 1 + ((lv1(level) / 2) | 0);
const perceptionMs = (level) => P().perceptionBaseMs + level * P().perceptionPerLevelMs;
const huntCdMs = (level) =>
  Math.max(P().huntCdMinMs, P().huntCdL1Ms - (((lv1(level) - 1) / 2) | 0) * P().huntCdPerStepMs);

const cdFor = (id, level) =>
  id === "radiance" ? P().radianceCdMs : huntCdMs(level);

function createPowerSystem() {
  const slots = POWERS.map(([id, glyph, hue]) => {
    const slot = button({
      className: "ps locked",
      style: powStyle(hue),
    });
    slot.dataset.power = id;
    slot.append(
      div({ className: "pg" }, glyph),
      div({ className: "pl" }, "0")
    );
    slot.disabled = true;
    slot.onclick = () => activatePower(id);
    return slot;
  });
  document.body.append(div({ id: "prk" }, ...slots));

  const gate = (id) =>
    id === "radiance" ? levelIndex >= P().radianceFromLevel : true;
  const unlocked = (id) => powerState[id].level > 0 && gate(id);

  const puzzleHold = () => bodyHas("rewarding");

  const huntPool = () => {
    const names = new Set(levelColors.map((c) => c.name));
    return triangles.filter((t) => !collected.has(t.id) && names.has(t.color.name));
  };

  function syncSlot(id) {
    const st = powerState[id];
    const slot = slots[POWER_IDS.indexOf(id)];
    slot.querySelector(".pl").textContent = String(st.level);
    const lock = !unlocked(id);
    const empty = !lock && id === "extraction" && !huntPool().length;
    const held = puzzleHold();
    tog(slot, "locked", lock || empty);
    tog(slot, "active", st.active);
    tog(slot, "cooling", st.cooling);
    slot.disabled = lock || empty || st.active || st.cooling || held;
  }
  const syncAll = () => POWER_IDS.forEach(syncSlot);

  function beginBusy(id, activeMs, cdMs) {
    const st = powerState[id];
    st.active = st.cooling = true;
    syncSlot(id);
    const cd = cdMs ?? huntCdMs(st.level);
    setTimeout(() => {
      st.active = false;
      syncSlot(id);
    }, Math.min(activeMs, cd));
    setTimeout(() => {
      st.cooling = false;
      syncSlot(id);
    }, cd);
  }

  function offerUpgrade() {
    return new Promise((resolve) => {
      pentagonClears++;
      const everyN = P().radianceEveryN;
      const skips = P().upgradeSkipAfter;
      const canPick = (id) =>
        !(upgradeSkip[id] > 0) &&
        gate(id) &&
        (id !== "radiance" || pentagonClears % everyN === 0);

      let picked = false;
      const commit = (id) => {
        if (picked || !canPick(id)) return;
        picked = true;
        off(modal, "show");
        setTimeout(() => modal.remove(), 750);
        for (const pid of POWER_IDS) if (upgradeSkip[pid] > 0) upgradeSkip[pid]--;
        const skip = skips[id] ?? 0;
        if (skip) upgradeSkip[id] = skip;
        const st = powerState[id];
        st.level++;
        beginBusy(id, 0, cdFor(id, st.level));
        syncSlot(id);
        resolve(id);
      };

      const choices = POWERS.map(([id, glyph, hue]) => {
        const st = powerState[id];
        const ok = canPick(id);
        const btn = button({
          className: ok ? "ppk" : "ppk locked",
          style: powStyle(hue),
        });
        btn.disabled = !ok;
        btn.append(
          div({ className: "ppk-glyph" }, glyph),
          div({ className: "ppk-lvl" }, `${st.level}→${st.level + 1}`)
        );
        if (ok) btn.onclick = () => commit(id);
        return btn;
      });

      const modal = div(
        { className: "pmod" },
        div({ className: "pmc" }, div({ className: "ppks" }, ...choices))
      );
      document.body.append(modal);
      nextFrame().then(() => on(modal, "show"));
    });
  }

  let perceptionTargets = new Set();
  let perceptionGen = 0;

  function endPerceptionHints() {
    perceptionTargets = new Set();
    clearAllHintMasks();
    const st = powerState.perception;
    if (st.active) {
      st.active = false;
      syncSlot("perception");
    }
  }

  function noteCollected(id) {
    clearHintMask(qs(`.cl[data-id="${id}"]`));
    if (perceptionTargets.delete(id) && !perceptionTargets.size) {
      perceptionGen++;
      endPerceptionHints();
    }
    syncAll();
  }

  function runPerception(level) {
    const facing = facingFaceKey?.();
    const opp = { N: "S", S: "N", E: "W", W: "E" }[facing];
    const all = huntPool();
    const pool = opp
      ? all.filter((t) => !(t.room === player.room && t.face === opp))
      : all;
    const picks = shuffle((pool.length ? pool : all).slice()).slice(0, huntCount(level));
    const p = P();
    const wash =
      level <= 1
        ? p.washL1Pct
        : Math.max(p.washMinPct, 100 - (level - 1) * p.washShrinkPct);
    const rTarget = (R_MAX * Math.min(140, wash)) / 100;
    const stagger = p.perceptionStaggerMs;
    const holdMs = perceptionMs(level);

    perceptionGen++;
    const gen = perceptionGen;
    perceptionTargets = new Set(picks.map((t) => t.id));

    picks.forEach((t, i) => {
      setTimeout(() => {
        if (gen !== perceptionGen) return;
        const layer = qs(`.cl[data-id="${t.id}"]`);
        if (!layer) return;
        clearHintMask(layer);
        addWashRect(layer, colorHsl(t.color));
        playHintMask(layer, rTarget);
      }, i * stagger);
    });

    setTimeout(() => {
      if (gen === perceptionGen) endPerceptionHints();
    }, (picks.length - 1) * stagger + holdMs);
  }

  function runExtraction(level) {
    if (puzzles?.isOpen?.()) return;
    const pool = huntPool();
    if (!pool.length) return;
    const colorName = shuffle([...new Set(pool.map((t) => t.color.name))])[0];
    const picks = shuffle(pool.filter((t) => t.color.name === colorName)).slice(
      0,
      huntCount(level)
    );
    const puzzle = puzzles?.map?.[colorName];
    const tab = qs(`.ct[data-color="${colorName}"]`);
    if (!puzzle || !tab) return;

    picks.forEach((t, i) => {
      const claim = claimTriangle(t.id);
      if (!claim) return;
      const { layer } = claim;
      if (!layer) return void puzzle.addPieceToTray(t.id);
      flyThen(
        layer,
        tab,
        { fill: colorHsl(t.color), delay: i * 90, fromOffscreen: true },
        () => puzzle.addPieceToTray(t.id)
      );
    });
  }

  function runRadiance(n) {
    if (!cubeRack?.openFaceCount?.()) return;
    triggerReward?.();
    Promise.resolve(cubeRack.addFaces?.(n)).then(() => {
      if (cubeRack.allComplete?.()) endGameWon?.();
      else if (levelCleared?.()) transitionToLevel?.(levelIndex + 1);
    });
  }

  function activatePower(id) {
    const st = powerState[id];
    if (!unlocked(id) || st.active || st.cooling || puzzleHold()) return;
    if (id === "extraction" && !huntPool().length) return;

    if (id === "perception") {
      const n = huntCount(st.level);
      const stagger = P().perceptionStaggerMs;
      runPerception(st.level);
      beginBusy(id, (n - 1) * stagger + perceptionMs(st.level), huntCdMs(st.level));
    } else if (id === "extraction") {
      runExtraction(st.level);
      beginBusy(id, 900, huntCdMs(st.level));
    } else {
      const n = Math.max(1, st.level);
      runRadiance(n);
      beginBusy(id, OPTS.fly.trophyMs * n + 400, P().radianceCdMs);
    }
  }

  syncAll();
  return { offerUpgrade, activatePower, syncAll, powerState, noteCollected };
}

const player = {
  room: 0,
  inspecting: false,
  right: [1, 0, 0],
  up: [0, 1, 0],
  forward: [0, 0, -1],
};

const FACES = [
  ["N", "face-n"],
  ["E", "face-e"],
  ["S", "face-s"],
  ["W", "face-w"],
  ["U", "face-u"],
  ["D", "face-d"],
];

let levelIndex = 0;
let rooms = [];
let triangles = [];
let levelColors = [];
let collected = new Set();
let solvedColors = new Set();
let puzzles = null;

const hiddensOn = (roomId, faceKey) =>
  triangles.filter(
    (h) => h.room === roomId && h.face === faceKey && !collected.has(h.id)
  );

// Camera basis (±90° on integer axes)

const snap = (n) => Math.round(n);

const rot90 = (v, axis, sign) => {
  const [x, y, z] = v;
  const [ax, ay, az] = axis;
  const dot = ax * x + ay * y + az * z;
  const cx = ay * z - az * y;
  const cy = az * x - ax * z;
  const cz = ax * y - ay * x;
  return [snap(ax * dot + sign * cx), snap(ay * dot + sign * cy), snap(az * dot + sign * cz)];
};

const basisToCSS = (right, up, forward) => {
  const [rx, ry, rz] = right;
  const [ux, uy, uz] = up;
  const [fx, fy, fz] = forward;
  return `matrix3d(${rx},${ux},${-fx},0, ${ry},${uy},${-fy},0, ${rz},${uz},${-fz},0, 0,0,0,1)`;
};

const vDot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vCross = (a, b) => [
  a[1] * b[2] - a[2] * b[1],
  a[2] * b[0] - a[0] * b[2],
  a[0] * b[1] - a[1] * b[0],
];
const same3 = (a, b) => a[0] === b[0] && a[1] === b[1] && a[2] === b[2];

const rotAround = (v, axis, ang) => {
  const c = Math.cos(ang);
  const s = Math.sin(ang);
  const d = vDot(v, axis);
  const [cx, cy, cz] = vCross(axis, v);
  const k = 1 - c;
  return [
    v[0] * c + cx * s + axis[0] * d * k,
    v[1] * c + cy * s + axis[1] * d * k,
    v[2] * c + cz * s + axis[2] * d * k,
  ];
};

const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);

const TURN_MS = OPTS.time.turnMs;
const INSPECT_OUT_MS = OPTS.time.inspectOutMs;
let turnRaf = null;
let turnBusy = false;

const animateTurn = (fromRight, fromUp, fromForward) => {
  if (turnRaf != null) cancelAnimationFrame(turnRaf);
  turnBusy = true;

  const axis = same3(fromUp, player.up)
    ? fromUp
    : same3(fromRight, player.right)
      ? fromRight
      : fromForward;
  const sign = Math.sign(vDot(vCross(fromForward, player.forward), axis)) || 1;
  const start = performance.now();

  const tick = (now) => {
    const t = Math.min(1, (now - start) / TURN_MS);
    if (t < 1) {
      const ang = sign * (Math.PI / 2) * easeInOut(t);
      pivot.style.transform = basisToCSS(
        rotAround(fromRight, axis, ang),
        rotAround(fromUp, axis, ang),
        rotAround(fromForward, axis, ang)
      );
      turnRaf = requestAnimationFrame(tick);
    } else {
      turnRaf = null;
      turnBusy = false;
      pivot.style.transform = basisToCSS(
        player.right,
        player.up,
        player.forward
      );
      updateView(false);
    }
  };

  turnRaf = requestAnimationFrame(tick);
};

function facingFaceKey() {
  const [fx, fy, fz] = player.forward;
  const ax = Math.abs(fx);
  const ay = Math.abs(fy);
  const az = Math.abs(fz);
  if (ay >= ax && ay >= az) return fy > 0 ? "U" : "D";
  if (ax >= az) return fx > 0 ? "E" : "W";
  return fz < 0 ? "N" : "S";
}

function buildRoom(spec) {
  const walls = FACES.filter(([key]) => !(key in spec.doors)).map(([key, cls]) => {
    const face = div({ className: "face" });
    face.dataset.face = key;
    const hides = hiddensOn(spec.id, key);
    paintWallMesh(
      face,
      undefined,
      hides.length
        ? {
            collectibles: hides.map((h) => ({ id: h.id, color: h.color })),
          }
        : {}
    );
    return div({ className: `wall ${cls}` }, face);
  });

  return div(
    {
      id: `room-${spec.id}`,
      className: "room",
      style: {
        transform: `translate3d(calc(${spec.x} * var(--span)), 0px, calc(${spec.z} * var(--span)))`,
      },
    },

const powers = createPowerSystem();

function levelCleared() {
  return (
    triangles.every((t) => collected.has(t.id)) &&
    levelColors.every((c) => solvedColors.has(c.name))
  );
}

function retireColorFromLevel(colorOrName) {
  const name =
    typeof colorOrName === "string" ? colorOrName : colorOrName?.name;
  if (!name) return;
  solvedColors.add(name);
  let stripped = false;
  for (const t of triangles) {
    if (t.color.name !== name || collected.has(t.id)) continue;
    collected.add(t.id);
    layerById(t.id)?.remove();
    stripped = true;
  }
  puzzles?.map?.[name]?.remove?.();
  if (puzzles?.map) delete puzzles.map[name];
  levelColors = levelColors.filter((c) => c.name !== name);
  if (stripped && player.inspecting) {
    const layers = faceLayers(inspectFace());
    if (layers.length) trackInspectHits(layers);
    else stopHitTracking();
  }
  powers?.syncAll?.();
}

async function onColorComplete(color, puzzle) {
  bodyOn("rewarding");
  powers?.syncAll?.();
  try {
    triggerReward();
    solvedColors.add(color.name);
    const left = triangles.filter(
      (t) => t.color.name === color.name && !collected.has(t.id)
    ).length;

    await wait(OPTS.time.solveHoldMs);

    const gem = await puzzle.collapseToGem();
    await cubeRack.deliver(color, gem);

    if (cubeRack.isColorComplete?.(color)) {
      retireColorFromLevel(color);
    } else if (left >= PER_COLOR) {
      puzzle.reset();
    } else {
      puzzle.remove();
    }

    if (cubeRack.allComplete?.()) {
      endGameWon();
      return;
    }
    await powers.offerUpgrade();
    if (levelCleared()) await transitionToLevel(levelIndex + 1);
  } finally {
    bodyOff("rewarding");
    powers?.syncAll?.();
  }
}

function endGameWon() {
  if (bodyHas("won")) return;
  bodyOn("won");
  qs(".pmod")?.remove();
  if (!document.getElementById("win")) {
    document.body.append(div({ id: "win" }, "You win"));
  }
}

async function transitionToLevel(index) {
  bodyOff("rewarding");
  player.inspecting = false;
  clearInspectTarget();
  stopHitTracking();

  on(viewport, "lx");
  await wait(OPTS.time.levelExitMs);

  startLevel(index);

  off(viewport, "lx");
  on(viewport, "le");
  void world.offsetWidth;
  await wait(OPTS.time.levelEnterPadMs);
  on(viewport, "li");
  await wait(OPTS.time.levelEnterMs);
  off(viewport, "le", "li");
}

function startLevel(index) {
  const exclude = cubeRack.completedNames?.() || [];
  const L = buildLevel(index, exclude);
  if (!L.colors.length) {
    endGameWon();
    return;
  }
  levelIndex = L.index;
  rooms = L.rooms;
  triangles = L.triangles;
  levelColors = L.colors;
  collected = new Set();
  solvedColors = new Set();
  player.room = 0;
  player.inspecting = false;
  player.right = [1, 0, 0];
  player.up = [0, 1, 0];
  player.forward = [0, 0, -1];

  puzzles?.destroy();
  puzzles = createPuzzleSet(L.colors, L.perColor, onColorComplete);

  clearAllHintMasks?.();
  world.replaceChildren(...rooms.map(buildRoom));
  updateView(false);
  powers?.syncAll?.();
}

function passageTarget() {
  const dir = facingFaceKey();
  if (dir === "U" || dir === "D") return null;
  const to = rooms[player.room].doors[dir];
  return to === undefined ? null : to;
}

function getFacingFaceEl() {
  const key = facingFaceKey();
  return qs(
    `#room-${player.room} .face[data-face="${key}"]`
  );
}

function updateView(animate = true) {
  tog(world, "na", !animate);
  tog(camera, "na", !animate);

  if (!turnBusy) {
    pivot.style.transform = basisToCSS(player.right, player.up, player.forward);
  }
  const r = rooms[player.room];
  if (!r) return;
  world.style.transform = `translate3d(calc(${-r.x} * var(--span)), 0px, calc(${-r.z} * var(--span)))`;
  tog(viewport, "inspecting", player.inspecting);

  const passage = passageTarget();

  if (player.inspecting) {
    setNavDisabled(turnBusy);
    actionBtn.disabled = false;
    actionBtn.textContent = "Back";
  } else {
    setNavDisabled(turnBusy);
    actionBtn.disabled = turnBusy;
    actionBtn.textContent = passage !== null ? "Go" : "Inspect";
  }
}

function setNavDisabled(busy) {
  leftBtn.disabled = busy;
  rightBtn.disabled = busy;
  upBtn.disabled = busy;
  downBtn.disabled = busy;
}

function navigateFromView(applyBasis) {
  if (turnBusy) return;

  const startTurn = () => {
    const fr = [...player.right],
      fu = [...player.up],
      ff = [...player.forward];
    applyBasis();
    animateTurn(fr, fu, ff);
    updateView(false);
  };

  if (!player.inspecting) {
    startTurn();
    return;
  }

  turnBusy = true;
  const face = inspectFace();
  const layers = faceLayers(face);
  stopHitTracking();
  resetRevealMask();
  layers.forEach(resetLayerMask);
  player.inspecting = false;
  clearInspectTarget();

  off(camera, "na");
  off(world, "na");
  off(viewport, "inspecting");
  setNavDisabled(true);
  actionBtn.disabled = true;

  onceEndOrTimeout(
    camera,
    INSPECT_OUT_MS + 80,
    () => {
      turnBusy = false;
      startTurn();
    },
    (e) => e.target === camera && e.propertyName === "transform"
  );
}

function turnLeft() {
  navigateFromView(() => {
    player.forward = rot90(player.forward, player.up, 1);
    player.right = rot90(player.right, player.up, 1);
  });
}

function turnRight() {
  navigateFromView(() => {
    player.forward = rot90(player.forward, player.up, -1);
    player.right = rot90(player.right, player.up, -1);
  });
}

function lookUp() {
  navigateFromView(() => {
    player.forward = rot90(player.forward, player.right, -1);
    player.up = rot90(player.up, player.right, -1);
  });
}

function lookDown() {
  navigateFromView(() => {
    player.forward = rot90(player.forward, player.right, 1);
    player.up = rot90(player.up, player.right, 1);
  });
}

function clearInspectTarget() {
  document
    .querySelectorAll(".face.it")
    .forEach((f) => off(f, "it"));
  document
    .querySelectorAll(".cl.hot, .ctri.hot")
    .forEach((el) => off(el, "hot"));
}

let hitRaf = null;
let inspectHits = [];

function stopHitTracking() {
  if (hitRaf != null) {
    cancelAnimationFrame(hitRaf);
    hitRaf = null;
  }
  inspectHits = [];
  inspectStage.hidden = true;
  inspectStage.replaceChildren();
}

function trackInspectHits(layers) {
  stopHitTracking();
  if (!layers.length) return;

  inspectHits = layers.map((layer) => {
    const hit = button({
      className: "ihit",
    });
    hit.addEventListener("pointerenter", () => on(layer, "hot"));
    hit.addEventListener("pointerleave", () => off(layer, "hot"));
    hit.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!layer.dataset.id) return;
      collectTriangle(layer.dataset.id, layer);
    });
    return { hit, layer };
  });

  inspectStage.hidden = false;
  inspectStage.replaceChildren(...inspectHits.map((h) => h.hit));

  const sync = () => {
    if (!player.inspecting || !inspectHits.length) return;
    const stage = inspectStage.getBoundingClientRect();
    const pad = 6;
    for (const { hit, layer } of inspectHits) {
      const poly = layer.querySelector(".ctri");
      const face = layer.closest(".face");
      const target = poly || face || layer;
      const r = target.getBoundingClientRect();
      box(hit, {
        x: r.left - stage.left - pad,
        y: r.top - stage.top - pad,
        w: Math.max(12, r.width + pad * 2),
        h: Math.max(12, r.height + pad * 2),
      });
    }
    hitRaf = requestAnimationFrame(sync);
  };

  hitRaf = requestAnimationFrame(sync);
}

function enterInspect() {
  if (passageTarget() !== null) return;
  player.inspecting = true;
  clearInspectTarget();

  const face = getFacingFaceEl();
  if (face) {
    on(face, "it");
    clearFaceHints(face);
    const layers = faceLayers(face);
    if (layers.length) {
      playRevealMask(layers);
      trackInspectHits(layers);
    } else {
      stopHitTracking();
    }
  }

  updateView();
}

function exitInspect() {
  const face = inspectFace();
  const layers = faceLayers(face);

  player.inspecting = false;
  stopHitTracking();
  updateView();

  if (layers.length) {
    playHideMask(layers, () => {
      off(face, "it");
    });
  } else {
    clearInspectTarget();
    resetRevealMask();
  }
}

function primaryAction() {
  if (turnBusy || puzzles?.isOpen()) return;
  if (player.inspecting) {
        exitInspect();
    return;
  }
  const to = passageTarget();
  if (to !== null) {
        player.room = to;
    updateView();
    return;
  }
  enterInspect();
}

function claimTriangle(id, el) {
  if (collected.has(id)) return null;
  const tri = triangles.find((t) => t.id === id);
  if (!tri) return null;
  collected.add(id);
  const layer =
    el?.closest?.(".cl") ||
    el ||
    layerById(id);
  const face = layer?.closest?.(".face");
  powers?.noteCollected?.(id);
  if (layer) layer.style.visibility = "hidden";
  return { tri, layer, face };
}

function collectTriangle(id, el) {
  const claim = claimTriangle(id, el);
  if (!claim) return;
    const { tri, layer, face } = claim;
  clearFaceHints(face);
  const others = face
    ? faceLayers(face).filter((l) => l !== layer)
    : [];

  if (player.inspecting && others.length) {
    for (const l of others) {
      const c = l.querySelector(".rc");
      setCircleR(c, R_MAX);
      on(l, "revealed");
      off(l, "revealing", "hiding");
      l.style.filter = "none";
    }
    revealLayers = others;
    trackInspectHits(others);
  } else {
    stopHitTracking();
    resetRevealMask();
    player.inspecting = false;
    clearInspectTarget();
    updateView();
  }

  puzzles?.flyIn(id, layer, tri.color);
}

controls.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  ({
    left: turnLeft,
    right: turnRight,
    up: lookUp,
    down: lookDown,
    action: primaryAction,
  })[btn.dataset.act]?.();
});

window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const powerId = POWER_KEY[e.key.toLowerCase()];
  if (powerId) {
    e.preventDefault();
    if (
      bodyHas("rewarding") ||
      qs(".pmod")
    )
      return;
    if (puzzles?.isOpen()) return;
    powers.activatePower(powerId);
    return;
  }
  if (puzzles?.isOpen()) {
    if (e.key === " " || e.key === "Enter") e.preventDefault();
    return;
  }
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    primaryAction();
    return;
  }
  const map = {
    ArrowLeft: turnLeft,
    ArrowRight: turnRight,
    ArrowUp: lookUp,
    ArrowDown: lookDown,
  };
  if (map[e.key]) {
    e.preventDefault();
    map[e.key]();
  }
});

ensureRevealDefs();
startLevel(0);
powerState.perception.level = 1;
powers.syncAll();

</script>
</body>
</html>
